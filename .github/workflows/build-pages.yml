name: Build GitHub Pages dist

on:
  push:
    branches: [main]
    paths:
      - "admin-web/src/**"
      - "admin-web/dist/TipOut/**"
      - "admin-web/dist/Configuration center/**"
      - "admin-web/dist/emenu-pro/**"
      - "admin-web/dist/kiosklite/**"
      - "admin-web/package.json"
      - "admin-web/package-lock.json"
      - "admin-web/vite.config.ts"
      - "admin-web/scripts/**"
      - ".github/workflows/build-pages.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            admin-web/package-lock.json
            admin-web/dist/kiosklite/package-lock.json

      - name: Install dependencies
        working-directory: admin-web
        run: npm ci

      - name: Install Kiosk dependencies
        working-directory: admin-web/dist/kiosklite
        run: npm ci --engine-strict=false

      - name: Build Kiosk embed
        working-directory: admin-web
        run: npm run build:kiosklite-embed -- --skip-install

      - name: Build admin-web dist
        working-directory: admin-web
        env:
          VITE_EMENU_SEASONING_MODE: browser
        run: npm run build

      - name: Commit dist if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build: CI 自动更新 GitHub Pages 构建产物"
          file_pattern: admin-web/dist/** admin-web/src/generated/build-stamp.ts
