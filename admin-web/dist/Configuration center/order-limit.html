<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>下单限制</title>
  <link rel="stylesheet" href="assets/common.css" />
  <style>
    :root {
      --ol-bg: #f5f7fa;
      --ol-card: #fff;
      --ol-border: #e5e7eb;
      --ol-fg: #111827;
      --ol-muted: #6b7280;
      --ol-primary: #1677ff;
      --ol-primary-soft: #e8f3ff;
      --ol-danger: #dc2626;
      --ol-danger-soft: #fee2e2;
      --ol-success: #16a34a;
      --ol-success-soft: #dcfce7;
      --ol-radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ol-fg);
      background: var(--ol-bg);
    }
    .page {
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card {
      background: var(--ol-card);
      border: 1px solid var(--ol-border);
      border-radius: var(--ol-radius);
      box-shadow: 0 2px 12px rgba(15, 23, 42, .04);
    }
    .header-card {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
    }
    .header-title h1 { margin: 0; font-size: 18px; font-weight: 600; }
    .header-title p { margin: 3px 0 0; font-size: 12px; color: var(--ol-muted); }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .btn {
      border: 1px solid var(--ol-border);
      background: #fff;
      color: var(--ol-fg);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      line-height: 1.2;
      cursor: pointer;
      transition: .15s;
    }
    .btn:hover { border-color: #c7ced9; background: #f8fafc; }
    .btn-primary { background: var(--ol-primary); color: #fff; border-color: var(--ol-primary); }
    .btn-primary:hover { background: #0f69df; border-color: #0f69df; }
    .btn-danger { color: var(--ol-danger); border-color: #fecaca; background: #fff5f5; }
    .btn-danger:hover { background: #fee2e2; }
    .pill {
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
    }
    .pill.active { background: var(--ol-primary-soft); border-color: #b9d8ff; color: #0d61cb; }
    .section-card { overflow: hidden; }
    .section-head {
      padding: 12px 16px;
      border-bottom: 1px solid var(--ol-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .section-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
    .section-body { padding: 12px 16px 16px; }
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 12px;
      border: 1px solid transparent;
    }
    .badge.primary { background: var(--ol-primary-soft); color: #0d61cb; border-color: #b9d8ff; }
    .badge.ok { background: var(--ol-success-soft); color: #166534; border-color: #bbf7d0; }
    .badge.off { background: var(--ol-danger-soft); color: #991b1b; border-color: #fecaca; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid #eef2f7;
      text-align: left;
      vertical-align: top;
    }
    th { font-size: 12px; color: var(--ol-muted); font-weight: 500; background: #fafcff; }
    td .sub { margin-top: 4px; font-size: 12px; color: var(--ol-muted); max-width: 240px; }
    .op-row { display: flex; flex-wrap: wrap; gap: 6px; }

    .sim-grid {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
      gap: 12px;
    }
    .sim-config {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .field { display: grid; gap: 4px; }
    .field label { font-size: 13px; color: var(--ol-muted); }
    .input, .select, .textarea {
      width: 100%;
      border: 1px solid var(--ol-border);
      border-radius: 10px;
      background: #fff;
      padding: 8px 10px;
      font-size: 13px;
      line-height: 1.3;
      outline: none;
    }
    .textarea { min-height: 80px; resize: vertical; }
    .input:focus, .select:focus, .textarea:focus { border-color: #9cc8ff; box-shadow: 0 0 0 3px #e8f3ff; }
    .hint-bar {
      margin-bottom: 12px;
      border: 1px solid #f7dcb0;
      background: #fff9ee;
      color: #8a5b16;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      display: none;
    }
    .cat-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .cat-pill {
      border: 1px solid var(--ol-border);
      background: #fff;
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 12px;
      cursor: pointer;
    }
    .cat-pill.active { background: var(--ol-primary); border-color: var(--ol-primary); color: #fff; }
    .dish-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      max-height: 560px;
      overflow: auto;
      padding-right: 2px;
    }
    .dish-card {
      border: 1px solid var(--ol-border);
      border-radius: 12px;
      padding: 10px;
      background: #fff;
      display: grid;
      gap: 8px;
      transition: .15s;
    }
    .dish-card.blocked { opacity: .6; }
    .dish-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .dish-name { font-size: 13px; font-weight: 600; }
    .dish-price { color: var(--ol-primary); font-weight: 700; font-size: 14px; }
    .dish-meta { font-size: 12px; color: var(--ol-muted); }
    .dish-err { font-size: 12px; color: var(--ol-danger); }
    .qty-row { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
    .qty-btn {
      width: 28px; height: 28px; border-radius: 999px; border: 1px solid var(--ol-border);
      background: #f8fafc; cursor: pointer;
    }
    .qty-btn.primary { background: var(--ol-primary); border-color: var(--ol-primary); color: #fff; }
    .qty-btn:disabled { opacity: .4; cursor: not-allowed; }
    .qty-num { min-width: 20px; text-align: center; font-weight: 600; font-size: 13px; }

    .order-card .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 10px 0;
    }
    .stat {
      border-radius: 10px;
      padding: 8px;
      background: #f8fafc;
      text-align: center;
    }
    .stat.accent { background: var(--ol-primary-soft); }
    .stat .num { font-size: 22px; font-weight: 700; }
    .stat .txt { font-size: 12px; color: var(--ol-muted); }
    .order-list {
      max-height: 380px;
      overflow: auto;
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }
    .order-item {
      border: 1px solid #edf2f7;
      border-radius: 9px;
      padding: 7px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      background: #fff;
    }
    .order-name { font-weight: 500; }
    .order-cat { color: var(--ol-muted); margin-top: 2px; }
    .order-empty {
      color: var(--ol-muted);
      font-size: 12px;
      text-align: center;
      padding: 18px 0;
    }
    .order-actions { display: flex; gap: 8px; margin-top: 10px; }

    .modal-mask {
      position: fixed; inset: 0; z-index: 1000;
      display: none; align-items: center; justify-content: center;
      background: rgba(2, 6, 23, .35); padding: 14px;
    }
    .modal-mask.nested { z-index: 1100; background: rgba(2, 6, 23, .45); }
    .modal {
      width: min(1020px, 100%);
      max-height: calc(100vh - 30px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 14px;
      background: #fff;
      border: 1px solid var(--ol-border);
      box-shadow: 0 18px 40px rgba(15, 23, 42, .18);
    }
    .modal.modal-sm { width: min(560px, 100%); }
    .modal-head {
      flex-shrink: 0;
      padding: 12px 14px;
      border-bottom: 1px solid var(--ol-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .modal-head h3 { margin: 0; font-size: 16px; font-weight: 600; }
    .icon-btn {
      width: 30px; height: 30px; border-radius: 999px;
      border: 1px solid var(--ol-border);
      background: #fff;
      cursor: pointer;
    }
    .modal-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 14px;
      display: grid;
      gap: 12px;
      align-content: start;
    }
    .steps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .step {
      display: grid; justify-items: center; gap: 4px;
    }
    .step-dot {
      width: 26px; height: 26px; border-radius: 999px;
      display: grid; place-items: center; font-size: 11px; font-weight: 700;
      background: #f1f5f9; color: #64748b;
      border: 1px solid #e2e8f0;
    }
    .step.done .step-dot { background: #16a34a; border-color: #16a34a; color: #fff; }
    .step.active .step-dot { background: var(--ol-primary); border-color: var(--ol-primary); color: #fff; }
    .step-text { font-size: 11px; color: var(--ol-muted); text-align: center; line-height: 1.25; }
    .wizard-sec { border: 1px solid var(--ol-border); border-radius: 12px; padding: 12px; }
    .wizard-sec h4 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
    .wizard-sec--plain {
      border: 0;
      background: transparent;
      border-radius: 0;
      padding: 12px;
    }
    .choice-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .choice-grid.three { grid-template-columns: repeat(3, 1fr); }
    .choice {
      border: 2px solid var(--ol-border);
      border-radius: 10px;
      background: #fff;
      padding: 10px;
      cursor: pointer;
      text-align: center;
      font-size: 13px;
      line-height: 1.4;
    }
    .choice.active { border-color: var(--ol-primary); background: var(--ol-primary-soft); }
    .round-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 0; }
    .round-tab { border-radius: 999px; padding: 6px 10px; font-size: 12px; }
    .round-tab.active {
      background: var(--ol-primary-soft);
      border-color: #b9d8ff;
      color: #0d61cb;
      font-weight: 600;
    }
    .round-chip { display: inline-flex; align-items: center; gap: 4px; }
    .round-del {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid #fecaca;
      background: #fff5f5;
      color: #b91c1c;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
    }
    .round-del:hover { background: #fee2e2; }
    .entity-grid {
      max-height: 210px; overflow: auto;
      border: 1px solid var(--ol-border); border-radius: 10px;
      padding: 8px;
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;
      margin-bottom: 8px;
    }
    .entity-item {
      border: 1px solid var(--ol-border); border-radius: 8px; padding: 6px;
      display: flex; align-items: center; gap: 6px; font-size: 12px;
      background: #fff;
    }
    .bmsp-root {
      overflow: hidden;
      border: 1px solid var(--ol-border);
      border-radius: 10px;
      background: #fff;
      margin-bottom: 8px;
    }
    .bmsp-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      min-height: 14rem;
    }
    .bmsp-grid.bmsp-grid--no-dish {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .bmsp-col {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-right: 1px solid var(--ol-border);
    }
    .bmsp-col:last-child { border-right: 0; }
    .bmsp-col-title {
      margin: 0;
      padding: 8px 10px;
      border-bottom: 1px solid var(--ol-border);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--ol-muted);
    }
    .bmsp-col > div {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 4px;
    }
    .bmsp-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 0;
      background: transparent;
      border-radius: 8px;
      padding: 6px 8px;
      text-align: left;
      cursor: pointer;
      font-size: 12px;
      color: #111827;
    }
    .bmsp-item:hover { background: #f8fafc; }
    .bmsp-item.active { background: #eff6ff; }
    .bmsp-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bmsp-badge {
      flex-shrink: 0;
      min-width: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: #eef2f7;
      color: #64748b;
      font-size: 11px;
      text-align: center;
    }
    .bmsp-cb { flex-shrink: 0; }
    .bmsp-empty {
      margin: 0;
      padding: 12px;
      font-size: 12px;
      color: var(--ol-muted);
    }
    .structure-summary {
      margin: 0 0 8px;
      font-size: 12px;
      color: var(--ol-muted);
    }
    .qty-scene-block {
      margin-bottom: 12px;
      padding: 10px;
      border: 1px solid #e8edf3;
      border-radius: 10px;
      background: #fff;
    }
    .qty-sub-label {
      margin: 0 0 6px;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
    }
    .qty-scene-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    .qty-scene-head strong { font-size: 13px; }
    .qty-scene-head .qty-hint { margin: 2px 0 0; }
    .qty-scene-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .qty-scene-chip {
      min-width: 112px;
      text-align: left;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.35;
      background: #fff;
      border: 1px solid #e2e8f0;
      cursor: pointer;
    }
    .qty-scene-chip.active {
      background: #e8f3ff;
      border-color: #93c5fd;
      color: #0d61cb;
      font-weight: 600;
    }
    .qty-scene-chip .qty-scene-status {
      display: block;
      margin-top: 2px;
      font-size: 11px;
      font-weight: 500;
    }
    .qty-scene-chip .qty-scene-status.done { color: #16a34a; }
    .qty-scene-chip .qty-scene-status.partial { color: #d97706; }
    .qty-scene-chip .qty-scene-status.empty { color: #94a3b8; }
    .qty-panel {
      margin-top: 10px;
      padding: 12px;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      background: #f8fbff;
    }
    .qty-panel-title {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 600;
    }
    .qty-panel-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }
    .qty-copy-list { display: grid; gap: 6px; margin: 8px 0; }
    .qty-copy-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #fff;
      font-size: 12px;
      cursor: pointer;
    }
    .qty-copy-item.is-checked {
      border-color: #93c5fd;
      background: #f8fbff;
    }
    .qty-dim-round-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
    }
    .qty-step-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }
    .person-range-list { display: grid; gap: 8px; }
    .person-range-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      border: 1px solid #edf2f7;
      border-radius: 8px;
      padding: 8px;
      background: #fff;
    }
    .person-range-row .input { width: 100%; }
    .person-range-sep { font-size: 12px; color: var(--ol-muted); }
    .qty-person-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .qty-round-block { margin-bottom: 12px; }
    .qty-hint {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--ol-muted);
      line-height: 1.4;
    }
    .qty-line-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .qty-line-tab {
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .qty-line-tab.active {
      background: var(--ol-primary-soft);
      border-color: #b9d8ff;
      color: #0d61cb;
      font-weight: 600;
    }
    .qty-line-tab .qty-line-count {
      min-width: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: #eef2f7;
      color: #64748b;
      font-size: 11px;
      text-align: center;
      font-weight: 600;
    }
    .qty-line-tab.active .qty-line-count {
      background: #dbeafe;
      color: #1d4ed8;
    }
    .qty-list { display: grid; gap: 6px; max-height: 220px; overflow: auto; }
    .qty-batch-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px;
      padding: 8px 10px;
      border: 1px solid #e8edf3;
      border-radius: 10px;
      background: #f8fafc;
    }
    .qty-batch-bar .btn { font-size: 12px; padding: 5px 10px; }
    .qty-batch-count {
      font-size: 12px;
      color: var(--ol-muted);
      min-width: 64px;
    }
    .qty-batch-apply {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }
    .qty-batch-apply .input {
      width: 88px;
      padding: 5px 8px;
      font-size: 12px;
    }
    .qty-row2 {
      display: grid;
      grid-template-columns: 18px minmax(0,1fr) 110px;
      gap: 8px;
      align-items: center;
      border: 1px solid #edf2f7;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 12px;
    }
    .qty-row2.is-selected {
      border-color: #93c5fd;
      background: #f8fbff;
    }
    .qty-row-check { margin: 0; cursor: pointer; }
    .week-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .week-btn { width: 30px; height: 30px; border-radius: 999px; }
    .week-btn.active { background: var(--ol-primary); border-color: var(--ol-primary); color: #fff; }
    .weekday-block {
      border: 1px solid #e8edf3;
      border-radius: 10px;
      padding: 10px;
      background: #fff;
      display: grid;
      gap: 8px;
    }
    .weekday-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
    }
    .bh-picker {
      display: grid;
      gap: 12px;
      margin-top: 10px;
    }
    .bh-card {
      display: block;
      border: 1px solid var(--ol-border);
      border-radius: 12px;
      padding: 14px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
      cursor: pointer;
      transition: box-shadow .15s, border-color .15s, background .15s;
    }
    .bh-card:hover { box-shadow: 0 6px 16px rgba(15, 23, 42, .08); }
    .bh-card.is-checked {
      border-color: #93c5fd;
      background: #f8fbff;
      box-shadow: 0 0 0 1px rgba(59, 130, 246, .15);
    }
    .bh-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .bh-card-main { min-width: 0; flex: 1; display: grid; gap: 8px; }
    .bh-card-title-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .bh-card-name {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      color: #111827;
    }
    .bh-card-date {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      background: #f1f5f9;
      color: #64748b;
      padding: 2px 8px;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .bh-card-time {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      color: #111827;
    }
    .bh-card-time span {
      margin: 0 6px;
      font-weight: 400;

      var BH_STORAGE_KEY = "bplant-module-setting-field:418-business-hour-schedules";
      var BH_DAYS_MON_FIRST = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
      var BH_DAY_BADGES = [
        { day: "sun", badge: "SUN" },
        { day: "mon", badge: "MON" },

        { day: "wed", badge: "WED" },

      ];

      function currentMonthIsoRange() {
        var now = new Date();
        var y = now.getFullYear();
        var m = String(now.getMonth() + 1).padStart(2, "0");
        var last = new Date(y, now.getMonth() + 1, 0).getDate();
        return {
          fromDate: y + "-" + m + "-01",
          toDate: y + "-" + m + "-" + String(last).padStart(2, "0")
        };
      }

      function defaultBusinessHourSchedules() {
        var range = currentMonthIsoRange();
        return [
          { id: "bh-preset-all-day", name: "All Day", openTime: "00:00", closeTime: "23:50", fromDate: range.fromDate, toDate: range.toDate, fromDay: "sun", toDay: "sat" },
          { id: "bh-preset-morning", name: "早上", openTime: "06:00", closeTime: "11:00", fromDate: range.fromDate, toDate: range.toDate, fromDay: "sun", toDay: "sat" },
          { id: "bh-preset-noon", name: "中午", openTime: "11:00", closeTime: "16:00", fromDate: range.fromDate, toDate: range.toDate, fromDay: "sun", toDay: "sat" },
          { id: "bh-preset-evening", name: "晚上", openTime: "16:00", closeTime: "24:00", fromDate: range.fromDate, toDate: range.toDate, fromDay: "sun", toDay: "sat" }
        ];
      }

      function expandBusinessHourActiveDays(fromDay, toDay) {
        var fromIdx = BH_DAYS_MON_FIRST.indexOf(fromDay);
        var toIdx = BH_DAYS_MON_FIRST.indexOf(toDay);
        var out = {};
        if (fromIdx < 0 || toIdx < 0) {
          BH_DAYS_MON_FIRST.forEach(function (d) { out[d] = true; });
          return out;
        }
        if (fromIdx <= toIdx) {
          for (var i = fromIdx; i <= toIdx; i++) out[BH_DAYS_MON_FIRST[i]] = true;
        } else {
          for (var j = fromIdx; j < BH_DAYS_MON_FIRST.length; j++) out[BH_DAYS_MON_FIRST[j]] = true;
          for (var k = 0; k <= toIdx; k++) out[BH_DAYS_MON_FIRST[k]] = true;
        }
        return out;
      }

      function getBusinessHourActiveDays(schedule) {
        if (schedule.activeDays && schedule.activeDays.length) {
          var set = {};
          schedule.activeDays.forEach(function (d) { set[d] = true; });
          return set;
        }
        return expandBusinessHourActiveDays(schedule.fromDay || "sun", schedule.toDay || "sat");
      }

      function formatBusinessHourDateRange(fromDate, toDate) {
        if (!fromDate && !toDate) return "未设置日期";
        if (fromDate && toDate && fromDate === toDate) return fromDate;
        if (fromDate && toDate) return fromDate + " 至 " + toDate;
        return fromDate || toDate;
      }

      function normalizeBusinessHourSchedule(raw) {
        var range = currentMonthIsoRange();
        return {
          id: raw.id,
          name: raw.name || "营业时间",
          openTime: raw.openTime || "09:00",
          closeTime: raw.closeTime || "22:00",
          fromDate: raw.fromDate || range.fromDate,
          toDate: raw.toDate || range.toDate,
          fromDay: raw.fromDay || "sun",
          toDay: raw.toDay || "sat",
          activeDays: Array.isArray(raw.activeDays) ? raw.activeDays.slice() : undefined
        };
      }

      function readBusinessHourSchedulesFromStore() {
        try {
          var raw = localStorage.getItem(BH_STORAGE_KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length) {
              return parsed
                .filter(function (s) { return s && s.id && s.name; })
                .map(normalizeBusinessHourSchedule);
            }
          }
        } catch (e) { /* ignore */ }
        return defaultBusinessHourSchedules().map(normalizeBusinessHourSchedule);
      }

      function renderBusinessHourDayBadges(schedule) {
        var active = getBusinessHourActiveDays(schedule);
        return BH_DAY_BADGES.filter(function (item) { return !!active[item.day]; })
          .map(function (item) {
            return "<span class='bh-day-badge' aria-hidden='true'>" + item.badge + "</span>";
          })
          .join("");
      }

      function renderBusinessHourCard(schedule, checked) {
        return (
          "<label class='bh-card" + (checked ? " is-checked" : "") + "' data-bh-schedule-card='" + esc(schedule.id) + "'>" +
            "<div class='bh-card-top'>" +

                "<div class='bh-card-title-row'>" +
                  "<h5 class='bh-card-name'>" + esc(schedule.name) + "</h5>" +
                  "<span class='bh-card-date'>" + esc(formatBusinessHourDateRange(schedule.fromDate, schedule.toDate)) + "</span>" +
                "</div>" +
                "<p class='bh-card-time'>" +
                  esc(schedule.openTime) +
                  "<span>—</span>" +
                  esc(schedule.closeTime) +
                "</p>" +
                "<div class='bh-day-badges'>" + renderBusinessHourDayBadges(schedule) + "</div>" +
              "</div>" +
              "<input class='bh-card-check' type='checkbox' data-bh-schedule-id='" + esc(schedule.id) + "'" + (checked ? " checked" : "") + " />" +
            "</div>" +
          "</label>"
        );
      }

      function formatBusinessHourSummary(schedule) {
        return formatBusinessHourDateRange(schedule.fromDate, schedule.toDate) +
          " · " +
          (schedule.openTime || "--:--") + "–" + (schedule.closeTime || "--:--");
      }

      function formatSelectedBusinessHoursLabel(ids) {
        var schedules = readBusinessHourSchedulesFromStore();
        var names = (ids || []).map(function (id) {
          var s = schedules.find(function (x) { return x.id === id; });
          return s ? s.name : null;
        }).filter(Boolean);
        if (!names.length) return "未选择营业时间";
        return names.join("、");
      }

      function createEmptyRoundRange(min, max) {
        return {
          min: min != null ? min : 1,
          max: max != null ? max : 99
        };
      }

      function createEmptyPersonRange(min, max, roundCount) {
        var roundQuantities = [];
        for (var i = 0; i < (roundCount || 0); i++) {
          roundQuantities.push({ quantitySettings: {} });
        }
        return {
          min: min != null ? min : 1,
          max: max != null ? max : 99,
          quantitySettings: {},
          roundQuantities: roundQuantities
        };
      }

      function formatPersonRangeLabel(range) {
        var min = Number(range.min) || 1;
        var max = Number(range.max) || 99;
        if (max >= 99) return min <= 1 ? "不限人数" : (min + "人及以上");
        if (min === max) return min + "人";
        if (min <= 1) return max + "人及以下";
        return min + "-" + max + "人";
      }

      function formatRoundRangeLabel(range) {
        var min = Number(range.min) || 1;
        var max = Number(range.max) || 99;
        if (max >= 99) return min <= 1 ? "不限轮次" : (min + "轮及以上");
        if (min === max) return "第" + min + "轮";
        if (min <= 1) return max + "轮及以下";
        return min + "-" + max + "轮";
      }

      function formatPersonRangesSummary(ranges) {
        if (!ranges || !ranges.length) return "未设置";
        return ranges.map(formatPersonRangeLabel).join(" / ");
      }

      function formatRoundRangesSummary(ranges) {
        if (!ranges || !ranges.length) return "未设置";
        return ranges.map(formatRoundRangeLabel).join(" / ");
      }

      function normalizeRoundRangesList(list) {
        if (!Array.isArray(list) || !list.length) return [createEmptyRoundRange(1, 99)];
        return list.map(function (r, i) {
          if (r && (r.min != null || r.max != null)) {
            return createEmptyRoundRange(Number(r.min) || 1, Number(r.max) || 99);
          }
          // 兼容旧版具名轮次：第 i 轮 → i+1 ~ i+1
          return createEmptyRoundRange(i + 1, i + 1);
        });
      }

      function ensurePersonRangesShape(draft) {
        if (!Array.isArray(draft.personRanges) || !draft.personRanges.length) {
          draft.personRanges = [createEmptyPersonRange(1, 99, draft.round === "multiRound" ? (draft.roundRanges || []).length : 0)];
        }
        if (draft.round === "multiRound") {
          draft.roundRanges = normalizeRoundRangesList(draft.roundRanges && draft.roundRanges.length ? draft.roundRanges : draft.rounds);
        } else if (!Array.isArray(draft.roundRanges)) {
          draft.roundRanges = [];
        }
        var roundCount = draft.round === "multiRound" ? (draft.roundRanges || []).length : 0;
        // 原地补齐，避免重建对象导致 setQtyValue 写到失效引用
        draft.personRanges.forEach(function (pr) {
          pr.min = Number(pr.min) || 1;
          pr.max = Number(pr.max) || 99;
          if (!pr.quantitySettings || typeof pr.quantitySettings !== "object") {
            pr.quantitySettings = {};
          }
          if (!Array.isArray(pr.roundQuantities)) pr.roundQuantities = [];
          while (pr.roundQuantities.length < roundCount) {
            pr.roundQuantities.push({ quantitySettings: {} });
          }
          if (pr.roundQuantities.length > roundCount) {
            pr.roundQuantities.length = roundCount;
          }
          pr.roundQuantities.forEach(function (rq) {
            if (!rq) return;
            if (!rq.quantitySettings || typeof rq.quantitySettings !== "object") {
              rq.quantitySettings = {};
            }
          });
        });
        if (draft.activePersonRange == null || draft.activePersonRange < 0 || draft.activePersonRange >= draft.personRanges.length) {
          draft.activePersonRange = 0;
        }
        if (draft.round === "multiRound") {
          if (draft.activeRound == null || draft.activeRound < 0 || draft.activeRound >= (draft.roundRanges || []).length) {
            draft.activeRound = Math.max(0, (draft.roundRanges || []).length - 1);
          }
        }
        return draft.personRanges;
      }

      function getActivePersonRange(draft) {
        ensurePersonRangesShape(draft);
        return draft.personRanges[draft.activePersonRange] || draft.personRanges[0];
      }

      function setQtyValue(draft, qtyKey, num) {
        ensurePersonRangesShape(draft);
        var pr = draft.personRanges[draft.activePersonRange] || draft.personRanges[0];
        if (!pr) return;
        if (draft.round === "multiRound") {
          var rq = pr.roundQuantities[draft.activeRound];
          if (!rq) {
            rq = { quantitySettings: {} };
            pr.roundQuantities[draft.activeRound] = rq;
          }
          if (!rq.quantitySettings) rq.quantitySettings = {};
          rq.quantitySettings[qtyKey] = num;
        } else {
          if (!pr.quantitySettings) pr.quantitySettings = {};
          pr.quantitySettings[qtyKey] = num;
        }
      }

      function getQtyMap(draft) {
        ensurePersonRangesShape(draft);
        var pr = draft.personRanges[draft.activePersonRange] || draft.personRanges[0];
        if (!pr) return {};
        if (draft.round === "multiRound") {
          var rq = (pr.roundQuantities || [])[draft.activeRound];
          return (rq && rq.quantitySettings) || {};
        }
        return pr.quantitySettings || {};
      }

      function getQtyMapAt(draft, personIndex, roundIndex) {
        ensurePersonRangesShape(draft);
        var pr = draft.personRanges[personIndex];
        if (!pr) return {};
        if (draft.round === "multiRound") {
          var rq = (pr.roundQuantities || [])[roundIndex];
          return (rq && rq.quantitySettings) || {};
        }
        return pr.quantitySettings || {};
      }

      function setQtyValueAt(draft, personIndex, roundIndex, qtyKey, num) {
        ensurePersonRangesShape(draft);
        var pr = draft.personRanges[personIndex];
        if (!pr) return;
        if (draft.round === "multiRound") {
          var rq = pr.roundQuantities[roundIndex];
          if (!rq) {
            rq = { quantitySettings: {} };
            pr.roundQuantities[roundIndex] = rq;
          }
          if (!rq.quantitySettings) rq.quantitySettings = {};
          rq.quantitySettings[qtyKey] = num;
        } else {
          if (!pr.quantitySettings) pr.quantitySettings = {};
          pr.quantitySettings[qtyKey] = num;
        }
      }

      function listQtyScenes(draft) {
        ensurePersonRangesShape(draft);
        var scenes = [];
        var isMulti = draft.round === "multiRound";
        draft.personRanges.forEach(function (pr, pi) {
          if (isMulti) {
            (draft.roundRanges || []).forEach(function (r, ri) {
              scenes.push({
                id: pi + ":" + ri,
                personIndex: pi,
                roundIndex: ri,
                label: formatPersonRangeLabel(pr) + " · " + formatRoundRangeLabel(r)
              });
            });
          } else {
            scenes.push({
              id: String(pi),
              personIndex: pi,
              roundIndex: null,
              label: formatPersonRangeLabel(pr)
            });
          }
        });
        return scenes;
      }

      function getActiveScene(draft) {
        var scenes = listQtyScenes(draft);
        if (!scenes.length) return null;
        var found = scenes.find(function (s) {
          if (s.personIndex !== draft.activePersonRange) return false;
          if (draft.round === "multiRound") return s.roundIndex === draft.activeRound;
          return true;
        });
        return found || scenes[0];
      }

      function resolveSceneSelection(draft) {
        var scenes = listQtyScenes(draft);
        if (!scenes.length) return null;
        var active = getActiveScene(draft);
        if (!active || !scenes.some(function (s) { return s.id === active.id; })) {
          active = scenes[0];
        }
        draft.activePersonRange = active.personIndex;
        if (draft.round === "multiRound") draft.activeRound = active.roundIndex;
        return active;
      }

      function sceneHasQtyOnLine(draft, scene, lineId, method) {
        var byLine = getDraftStructureByLine(draft);
        var keys = listQtyItems(byLine, method)
          .filter(function (it) { return it.lineId === lineId; })
          .map(function (item) { return qtyKeyForItem(method, item); });
        if (!keys.length) return false;
        var map = getQtyMapAt(draft, scene.personIndex, scene.roundIndex);
        return keys.some(function (k) { return Number(map[k]) > 0; });
      }

      function getSceneCompletion(draft, scene, lineOpts, method) {
        if (!lineOpts || !lineOpts.length) return "empty";
        var hit = 0;
        lineOpts.forEach(function (line) {
          if (sceneHasQtyOnLine(draft, scene, line.id, method)) hit += 1;
        });
        if (hit <= 0) return "empty";
        if (hit >= lineOpts.length) return "done";
        return "partial";
      }

      function completionLabel(status) {
        if (status === "done") return { cls: "done", text: "● 已配置" };
        if (status === "partial") return { cls: "partial", text: "◐ 部分产线" };
        return { cls: "empty", text: "○ 未配置" };
      }

      function cloneDimEditorDraft(draft) {
        ensurePersonRangesShape(draft);
        return {
          personRanges: (draft.personRanges || []).map(function (pr) {
            return {
              min: pr.min,
              max: pr.max,
              quantitySettings: Object.assign({}, pr.quantitySettings || {}),
              roundQuantities: (pr.roundQuantities || []).map(function (rq) {
                return { quantitySettings: Object.assign({}, (rq && rq.quantitySettings) || {}) };
              })
            };
          }),
          roundRanges: (draft.roundRanges || []).map(function (r) {
            return createEmptyRoundRange(r.min, r.max);
          })
        };
      }

      function ensureDimEditorShape(dim, isMulti) {
        if (!dim.personRanges || !dim.personRanges.length) {
          dim.personRanges = [createEmptyPersonRange(1, 99, isMulti ? (dim.roundRanges || []).length : 0)];
        }
        if (!Array.isArray(dim.roundRanges)) dim.roundRanges = [];
        if (isMulti && !dim.roundRanges.length) dim.roundRanges = [createEmptyRoundRange(1, 99)];
        var roundCount = isMulti ? dim.roundRanges.length : 0;
        dim.personRanges.forEach(function (pr) {
          pr.min = Number(pr.min) || 1;
          pr.max = Number(pr.max) || 99;
          if (!pr.quantitySettings || typeof pr.quantitySettings !== "object") pr.quantitySettings = {};
          if (!Array.isArray(pr.roundQuantities)) pr.roundQuantities = [];
          while (pr.roundQuantities.length < roundCount) pr.roundQuantities.push({ quantitySettings: {} });
          if (pr.roundQuantities.length > roundCount) pr.roundQuantities.length = roundCount;
          pr.roundQuantities.forEach(function (rq) {
            if (!rq.quantitySettings || typeof rq.quantitySettings !== "object") rq.quantitySettings = {};
          });
        });
        return dim;
      }

      function validateRanges(ranges, kind) {
        var label = kind === "round" ? "轮次区间" : "人数区间";
        if (!ranges || !ranges.length) return "请至少设置一个" + label;
        var normalized = ranges.map(function (r, i) {
          return { min: Number(r.min), max: Number(r.max), index: i };
        });
        for (var i = 0; i < normalized.length; i++) {
          var r = normalized[i];
          if (!Number.isFinite(r.min) || !Number.isFinite(r.max) || r.min < 1 || r.max < 1) {
            return "第 " + (i + 1) + " 个" + label + "需为正整数";
          }
          if (r.min > r.max) return "第 " + (i + 1) + " 个" + label + "的最小值不能大于最大值";
        }
        var sorted = normalized.slice().sort(function (a, b) { return a.min - b.min || a.max - b.max; });
        for (var j = 0; j < sorted.length; j++) {
          for (var k = j + 1; k < sorted.length; k++) {
            var a = sorted[j];
            var b = sorted[k];
            if (a.max >= b.min) {
              return label + "不能重叠（请检查 " + a.min + "-" + a.max + " 与 " + b.min + "-" + b.max + "）";
            }
          }
        }
        return null;
      }

      function validatePersonRanges(ranges) {
        return validateRanges(ranges, "person");
      }

      function validateRoundRanges(ranges) {
        return validateRanges(ranges, "round");
      }

      function findPersonRangeIndexByCount(ranges, personCount) {
        var count = Number(personCount) || 0;
        for (var i = 0; i < (ranges || []).length; i++) {
          var r = ranges[i];
          if (count >= Number(r.min) && count <= Number(r.max)) return i;
        }
        return -1;
      }

      function findRoundRangeIndexByRound(ranges, roundNo) {
        return findPersonRangeIndexByCount(ranges, roundNo);
      }

      function getDraftStructureByLine(draft) {
        return MenuPicker
          ? MenuPicker.normalizeByLine(draft.structureByLine)
          : emptyStructureByLine();
      }

      function syncEntitiesFromStructure(target, method, byLine) {
        if (!MenuPicker) return;
        if (method === "perCategory") {
          target.selectedCategories = MenuPicker.listSelectedCategories(byLine).map(function (c) {
            return c.lineId + "|" + c.key;
          });
          target.selectedDishes = [];
        } else {
          target.selectedDishes = MenuPicker.listSelectedDishes(byLine).map(function (d) {
            return d.lineId + "|" + d.key;
          });
          target.selectedCategories = [];
        }
      }

      function applyStructureToDraft(draft, byLine) {
        byLine = MenuPicker ? MenuPicker.normalizeByLine(byLine) : emptyStructureByLine();
        draft.structureByLine = byLine;
        syncEntitiesFromStructure(draft, draft.method, byLine);
      }

      function qtyKeyForItem(method, item) {
        return (method === "perCategory" ? "category_" : "dish_") + item.lineId + "_" + item.key;
      }

      function listQtyItems(byLine, method) {
        if (!MenuPicker) return [];
        return method === "perCategory"
          ? MenuPicker.listSelectedCategories(byLine)
          : MenuPicker.listSelectedDishes(byLine);
      }

      function getQtyLineOptions(byLine, method) {
        if (!MenuPicker) return [];
        var items = listQtyItems(byLine, method);
        return MenuPicker.LINE_OPTIONS.map(function (line) {
          var count = items.filter(function (it) { return it.lineId === line.id; }).length;
          return { id: line.id, label: line.label, count: count };
        }).filter(function (line) { return line.count > 0; });
      }

      function resolveActiveQtyLine(draft, byLine, method) {
        var lines = getQtyLineOptions(byLine, method);
        if (!lines.length) return null;
        if (draft.activeQtyLine && lines.some(function (l) { return l.id === draft.activeQtyLine; })) {
          return draft.activeQtyLine;
        }
        return lines[0].id;
      }

      function displayQtyItemName(item, method) {
        if (method !== "perCategory") return item.name;
        var suffix = "（" + item.lineLabel + "）";
        if (item.name.length > suffix.length && item.name.slice(-suffix.length) === suffix) {
          return item.name.slice(0, -suffix.length);
        }
        return item.name;
      }

      function getVisibleQtyKeys(draft, method, activeLine) {
        var byLine = getDraftStructureByLine(draft);
        return listQtyItems(byLine, method)
          .filter(function (it) { return it.lineId === activeLine; })
          .map(function (item) { return qtyKeyForItem(method, item); });
      }

      function normalizeSelectedQtyKeys(draft, visibleKeys) {

      function typeKeyToLabel(type) {
        if (type === "perTable") return "按桌/订单限购";
        if (type === "perPerson") return "按人限购";
        return "";
      }
      function roundKeyToLabel(round) {
        if (round === "perRound") return "每轮";
        if (round === "multiRound") return "多轮";
        if (round === "ignoreRound") return "与轮次无关";
        return "";
      }
      function methodKeyToLabel(method) {
        if (method === "perCategory") return "按每个分类限购";
        if (method === "perDish") return "按每种菜品限购";
        return "";
      }
      function labelToTypeKey(type) { return type === "按人限购" ? "perPerson" : "perTable"; }
      function labelToRoundKey(round) {
        if (round === "多轮") return "multiRound";
        if (round === "与轮次无关") return "ignoreRound";
        return "perRound";
      }
      function labelToMethodKey(method) { return method === "按每种菜品限购" ? "perDish" : "perCategory"; }

      function parsePersonRanges(persons) {
        if (!persons) return [{ min: 1, max: 99 }];
        if (persons.indexOf("所有") >= 0 || persons.indexOf("不限") >= 0) return [{ min: 1, max: 99 }];
        var parts = String(persons).split(/\s*[/，,]\s*/);
        var out = [];
        for (var i = 0; i < parts.length; i++) {
          var part = parts[i];
          if (!part) continue;
          var mRange = part.match(/(\d+)\s*[-~～至]+\s*(\d+)/);
          if (mRange) {
            out.push({ min: Number(mRange[1]), max: Number(mRange[2]) });
            continue;
          }
          var mPlus = part.match(/(\d+)\s*人及以上/);
          if (mPlus) {
            out.push({ min: Number(mPlus[1]), max: 99 });
            continue;
          }
          var mSingle = part.match(/(\d+)\s*人/);
          if (mSingle) {
            var n = Number(mSingle[1]);
            out.push({ min: n, max: n });
          }
        }
        return out.length ? out : [{ min: 1, max: 99 }];
      }

      function ruleToDraft(rule) {
        var weekdayMap = {};
        if (rule.weekdayTimeRanges && typeof rule.weekdayTimeRanges === "object") {
          Object.keys(rule.weekdayTimeRanges).forEach(function (dayId) {
            var ranges = rule.weekdayTimeRanges[dayId] || [];
            weekdayMap[dayId] = ranges.map(function (t) { return { start: t.start, end: t.end }; });
          });
        } else if (rule.enableTimeSettings && rule.weekdays && rule.weekdays.length) {
          var legacyRanges = (rule.timeRanges || []).map(function (t) { return { start: t.start, end: t.end }; });
          rule.weekdays.forEach(function (dayId) {
            weekdayMap[dayId] = legacyRanges.map(function (t) { return { start: t.start, end: t.end }; });
          });
        }
        var selectedWeekdays = Object.keys(weekdayMap).length
          ? Object.keys(weekdayMap)
          : (rule.weekdays || []).slice();
        var structureByLine = MenuPicker
          ? MenuPicker.normalizeByLine(rule.structureByLine)
          : emptyStructureByLine();
        var selectedCategories = (rule.selectedCategories || []).slice();
        var selectedDishes = (rule.selectedDishes || []).slice();
        // 兼容旧数据：多轮曾把商品挂在各轮上，迁移为规则级共享选品
        if (MenuPicker && MenuPicker.countDishes(structureByLine) <= 0 && rule.rounds && rule.rounds.length) {
          for (var ri = 0; ri < rule.rounds.length; ri++) {
            var legacyRound = rule.rounds[ri];
            var legacyByLine = MenuPicker.normalizeByLine(legacyRound.structureByLine);
            if (MenuPicker.countDishes(legacyByLine) > 0) {
              structureByLine = legacyByLine;
              if (legacyRound.selectedCategories && legacyRound.selectedCategories.length) {
                selectedCategories = legacyRound.selectedCategories.slice();
              }
              if (legacyRound.selectedDishes && legacyRound.selectedDishes.length) {
                selectedDishes = legacyRound.selectedDishes.slice();
              }
              break;
            }
          }
        }
        var draft = {
          step: 1,
          type: labelToTypeKey(rule.type),
          round: labelToRoundKey(rule.round),
          method: labelToMethodKey(rule.method),
          name: rule.name,
          description: rule.description,
          personRanges: parsePersonRanges(rule.persons),
          activePersonRange: 0,
          structureByLine: structureByLine,
          selectedCategories: selectedCategories,
          selectedDishes: selectedDishes,
          quantitySettings: Object.assign({}, rule.quantitySettings || {}),

          minTotalQuantity: rule.minTotalQuantity,

          minPerPersonQuantity: rule.minPerPersonQuantity,

          maxSingleOrder: rule.maxSingleOrder,
          rounds: (rule.rounds || []).slice(),
          roundRanges: normalizeRoundRangesList(rule.roundRanges && rule.roundRanges.length ? rule.roundRanges : rule.rounds),
          activeRound: 0,
          activeQtyLine: null,
          selectedQtyKeys: [],
          batchQtyValue: "",
          dimEditorOpen: false,
          dimEditorDraft: null,
          copySceneOpen: false,
          copyTargetSceneIds: [],
          copyCurrentLineOnly: true,
          enableMemberLevels: !!rule.enableMemberLevels,

          enableTimeSettings: !!rule.enableTimeSettings,
          selectedBusinessHourIds: (rule.selectedBusinessHourIds || []).slice(),
          selectedWeekdays: selectedWeekdays,
          timeRanges: (rule.timeRanges || []).map(function (t) { return { start: t.start, end: t.end }; }),
          weekdayTimeRanges: weekdayMap,

        // 迁移：优先使用新结构 personRanges；否则从旧 quantitySettings / rounds 灌入第一档区间
        if (Array.isArray(rule.personRanges) && rule.personRanges.length) {
          draft.personRanges = rule.personRanges.map(function (pr) {

      function buildDishesSummary(draft) {

      function draftToRule(draft, existing) {
        ensurePersonRangesShape(draft);
        var isMulti = draft.round === "multiRound";

          draft.selectedWeekdays.forEach(function (dayId) {
            var ranges = (draft.weekdayTimeRanges && draft.weekdayTimeRanges[dayId]) || [];

        if (weekdayTimeRanges && Object.keys(weekdayTimeRanges).length) {

        }
        var selectedBusinessHourIds = draft.enableTimeSettings
          ? (draft.selectedBusinessHourIds || []).slice()
          : [];
        var personRanges = draft.personRanges.map(function (pr) {
          return {
            min: Number(pr.min) || 1,
            max: Number(pr.max) || 99,
            quantitySettings: isMulti ? undefined : Object.assign({}, pr.quantitySettings || {}),
            roundQuantities: isMulti
              ? (pr.roundQuantities || []).map(function (rq) {

        return {
          id: existing ? existing.id : 0,
          name: draft.name.trim(),
          type: typeKeyToLabel(draft.type),
          round: roundKeyToLabel(draft.round),
          method: methodKeyToLabel(draft.method),
          persons: formatPersonRangesSummary(personRanges),
          personRanges: personRanges,
          dishes: buildDishesSummary(draft),
          status: existing ? existing.status : "active",
          created: existing ? existing.created : new Date().toISOString().split("T")[0],
          description: draft.description.trim() || draft.name.trim(),
          structureByLine: draft.structureByLine,
          selectedCategories: draft.selectedCategories,
          selectedDishes: draft.selectedDishes,
          rounds: isMulti
            ? (draft.roundRanges || []).map(function (r) {
                return { min: Number(r.min) || 1, max: Number(r.max) || 99 };
              })
            : undefined,
          roundRanges: isMulti
            ? (draft.roundRanges || []).map(function (r) {
                return { min: Number(r.min) || 1, max: Number(r.max) || 99 };
              })
            : undefined,

          quantitySettings: !isMulti ? Object.assign({}, firstPr.quantitySettings || {}) : undefined,
          maxSameDishSettings: !isMulti ? draft.maxSameDishSettings : undefined,
          minTotalQuantity: !isMulti ? draft.minTotalQuantity : undefined,
          maxTotalQuantity: !isMulti ? draft.maxTotalQuantity : undefined,
          minPerPersonQuantity: draft.type === "perTable" && !isMulti ? draft.minPerPersonQuantity : undefined,
          maxPerPersonQuantity: draft.type === "perTable" && !isMulti ? draft.maxPerPersonQuantity : undefined,
          minSingleOrder: draft.type === "perTable" && !isMulti ? draft.minSingleOrder : undefined,
          maxSingleOrder: draft.type === "perTable" && !isMulti ? draft.maxSingleOrder : undefined,
          enableMemberLevels: !!draft.enableMemberLevels,
          memberLevels: draft.enableMemberLevels ? draft.selectedMemberLevels : undefined,
          enableTimeSettings: !!draft.enableTimeSettings,

          weekdays: draft.enableTimeSettings && draft.selectedWeekdays && draft.selectedWeekdays.length
            ? draft.selectedWeekdays

          weekdayTimeRanges: draft.enableTimeSettings ? weekdayTimeRanges : undefined,

      function validateDraftStep2(draft) {
        if (!draft.name.trim()) return "请输入规则名称";
        var byLine = MenuPicker
          ? MenuPicker.normalizeByLine(draft.structureByLine)
          : emptyStructureByLine();
        if (!MenuPicker || MenuPicker.countDishes(byLine) <= 0) return "请至少选择一个商品";
        return null;
      }

      function validateDraftStep3(draft) {
        ensurePersonRangesShape(draft);
        var personErr = validatePersonRanges(draft.personRanges);
        if (personErr) return personErr;
        if (draft.round === "multiRound") {
          var roundErr = validateRoundRanges(draft.roundRanges);
          if (roundErr) return roundErr;
        }
        var anyQty = draft.personRanges.some(function (pr) {
          if (draft.round === "multiRound") {
            return (pr.roundQuantities || []).some(function (rq) {
              return Object.values((rq && rq.quantitySettings) || {}).some(function (v) { return Number(v) > 0; });
            });
          }
          return Object.values(pr.quantitySettings || {}).some(function (v) { return Number(v) > 0; });
        });
        if (!anyQty) return "请至少在某一人数区间设置大于 0 的限购数量（填 0 表示不可点）";
        return null;
      }

      function validateDraftStep4(draft) {
        if (!draft.enableTimeSettings) return null;
        if (!(draft.selectedBusinessHourIds || []).length) {
          return "请至少选择一个营业时间段";
        }
        return null;
      }

      function validateDraftStep5(draft) {
        if (!draft.enableMemberLevels) return null;
        if (!(draft.selectedMemberLevels || []).length) {
          return "请至少选择一个会员等级";
        }
        return null;
      }

      /* ─── 同商品规则冲突：选品展开 / 时间会员域 / 冲突引擎 ─── */

      function parseStoredEntityKey(value) {
        if (typeof value !== "string" || value.indexOf("|") < 0) return null;
        var idx = value.indexOf("|");
        var lineId = value.slice(0, idx);
        var key = value.slice(idx + 1);
        if (!lineId || !key) return null;
        return { lineId: lineId, key: key };
      }

      function restoreStructureByLine(values) {
        var byLine = emptyStructureByLine();
        (values || []).forEach(function (value) {
          var parsed = parseStoredEntityKey(value);
          if (!parsed) return;
          if (!byLine[parsed.lineId]) byLine[parsed.lineId] = [];
          if (byLine[parsed.lineId].indexOf(parsed.key) < 0) {
            byLine[parsed.lineId].push(parsed.key);
          }
        });
        return MenuPicker ? MenuPicker.normalizeByLine(byLine) : byLine;
      }

      function mergeStructureByLine(into, from) {
        var src = MenuPicker ? MenuPicker.normalizeByLine(from) : (from || emptyStructureByLine());
        Object.keys(src).forEach(function (lineId) {
          if (!into[lineId]) into[lineId] = [];
          (src[lineId] || []).forEach(function (key) {
            if (into[lineId].indexOf(key) < 0) into[lineId].push(key);
          });
        });
        return into;
      }

      function targetsFromStructure(byLine) {
        if (!MenuPicker) return [];
        return MenuPicker.listSelectedDishes(byLine).map(function (d) {
          return {
            targetKey: d.lineId + "|" + d.key,
            lineId: d.lineId,
            dishName: d.name
          };
        });
      }

      function isStringEntityKey(value) {
        return typeof value === "string" && value.indexOf("|") >= 0;
      }

      function isNumericEntityId(value) {
        return typeof value === "number" || (typeof value === "string" && /^\d+$/.test(value));
      }

      function collectEntityValues(rule, field) {
        var out = [];
        function add(arr) {
          (arr || []).forEach(function (v) { out.push(v); });
        }
        add(rule[field]);
        (rule.rounds || []).forEach(function (round) {
          add(round[field]);
        });
        return out;
      }

      function legacyRuleDishTargets(rule) {
        var out = [];
        var seen = {};
        function pushLegacy(dishId, dishName) {
          var targetKey = "legacy|dish:" + dishId;
          if (seen[targetKey]) return;
          seen[targetKey] = true;
          out.push({ targetKey: targetKey, lineId: "legacy", dishName: dishName || ("菜品#" + dishId) });
        }
        collectEntityValues(rule, "selectedDishes").forEach(function (v) {
          if (!isNumericEntityId(v)) return;
          var id = Number(v);
          var dish = dishes.find(function (d) { return d.id === id; });
          pushLegacy(id, dish ? dish.name : null);
        });
        collectEntityValues(rule, "selectedCategories").forEach(function (v) {
          if (!isNumericEntityId(v)) return;
          var catId = Number(v);
          var cat = dishCategories.find(function (c) { return c.id === catId; });
          if (!cat) return;
          dishes.forEach(function (d) {
            if (d.category === cat.name) pushLegacy(d.id, d.name);
          });
        });
        return out;
      }

      function expandRuleDishTargets(rule) {
        var seen = {};
        var out = [];
        function pushAll(list) {
          (list || []).forEach(function (item) {
            if (!item || !item.targetKey || seen[item.targetKey]) return;
            seen[item.targetKey] = true;
            out.push(item);
          });
        }

        if (MenuPicker && rule.structureByLine) {
          var topByLine = MenuPicker.normalizeByLine(rule.structureByLine);
          if (MenuPicker.countDishes(topByLine) > 0) {
            pushAll(targetsFromStructure(topByLine));
            return out;
          }
        }

        var topStringKeys = []
          .concat(rule.selectedDishes || [])
          .concat(rule.selectedCategories || [])
          .filter(isStringEntityKey);
        if (topStringKeys.length && MenuPicker) {
          var restoredTop = restoreStructureByLine(topStringKeys);
          if (MenuPicker.countDishes(restoredTop) > 0) {
            pushAll(targetsFromStructure(restoredTop));
            return out;
          }
        }

        var mergedByLine = emptyStructureByLine();
        var hasRoundStructure = false;
        var roundStringKeys = [];
        (rule.rounds || []).forEach(function (round) {
          if (MenuPicker && round.structureByLine) {
            var roundByLine = MenuPicker.normalizeByLine(round.structureByLine);
            if (MenuPicker.countDishes(roundByLine) > 0) {
              hasRoundStructure = true;
              mergeStructureByLine(mergedByLine, roundByLine);
            }
          }
          [].concat(round.selectedDishes || []).concat(round.selectedCategories || [])
            .filter(isStringEntityKey)
            .forEach(function (k) { roundStringKeys.push(k); });
        });
        if (hasRoundStructure && MenuPicker) {
          pushAll(targetsFromStructure(MenuPicker.normalizeByLine(mergedByLine)));
          return out;
        }
        if (roundStringKeys.length && MenuPicker) {
          var restoredRounds = restoreStructureByLine(roundStringKeys);
          if (MenuPicker.countDishes(restoredRounds) > 0) {
            pushAll(targetsFromStructure(restoredRounds));
            return out;
          }
        }

        pushAll(legacyRuleDishTargets(rule));
        return out;
      }

      function parseClockMinutes(value) {
        if (value == null) return null;
        var text = String(value).trim();
        var m = text.match(/^(\d{1,2}):(\d{2})$/);
        if (!m) return null;
        var hh = Number(m[1]);
        var mm = Number(m[2]);
        if (hh === 24 && mm === 0) return 1440;
        if (hh < 0 || hh > 23 || mm < 0 || mm > 59) return null;
        return hh * 60 + mm;
      }

      function parseIsoDateParts(iso) {
        if (!iso || typeof iso !== "string") return null;
        var m = iso.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!m) return null;
        return { y: Number(m[1]), m: Number(m[2]), d: Number(m[3]) };
      }

      function formatIsoDateParts(parts) {
        return parts.y + "-" +
          String(parts.m).padStart(2, "0") + "-" +
          String(parts.d).padStart(2, "0");
      }

      function addDaysToIso(iso, delta) {
        var parts = parseIsoDateParts(iso);
        if (!parts) return null;
        var dt = new Date(parts.y, parts.m - 1, parts.d + delta);
        return formatIsoDateParts({
          y: dt.getFullYear(),
          m: dt.getMonth() + 1,
          d: dt.getDate()
        });
      }

      function weekdayKeyFromIso(iso) {
        var parts = parseIsoDateParts(iso);
        if (!parts) return null;
        var dt = new Date(parts.y, parts.m - 1, parts.d);
        return ["sun", "mon", "tue", "wed", "thu", "fri", "sat"][dt.getDay()];
      }

      function compareIsoDate(a, b) {
        if (a === b) return 0;
        return a < b ? -1 : 1;
      }

      function minutesRangesOverlap(aStart, aEnd, bStart, bEnd) {
        return aStart < bEnd && bStart < aEnd;
      }

      function splitScheduleWindows(schedule) {
        var open = parseClockMinutes(schedule.openTime);
        var close = parseClockMinutes(schedule.closeTime);
        if (open == null || close == null) return null;
        var overnight = close <= open && close !== 1440;
        var active = getBusinessHourActiveDays(schedule);
        var fromDate = schedule.fromDate;
        var toDate = schedule.toDate;
        if (!fromDate || !toDate || compareIsoDate(fromDate, toDate) > 0) return null;
        var windows = [];
        var cursor = fromDate;
        var guard = 0;
        while (compareIsoDate(cursor, toDate) <= 0 && guard < 4000) {
          guard += 1;
          var dayKey = weekdayKeyFromIso(cursor);
          if (dayKey && active[dayKey]) {
            if (!overnight) {
              windows.push({ date: cursor, dayKey: dayKey, startMin: open, endMin: close });
            } else {
              windows.push({ date: cursor, dayKey: dayKey, startMin: open, endMin: 1440 });
              var nextDate = addDaysToIso(cursor, 1);
              var nextDay = weekdayKeyFromIso(nextDate);
              if (nextDate && nextDay) {
                windows.push({ date: nextDate, dayKey: nextDay, startMin: 0, endMin: close });
              }
            }
          }
          cursor = addDaysToIso(cursor, 1);
          if (!cursor) break;
        }
        return windows;
      }

      function scheduleWindowsOverlap(scheduleA, scheduleB) {
        var windowsA = splitScheduleWindows(scheduleA);
        var windowsB = splitScheduleWindows(scheduleB);
        if (!windowsA || !windowsB) return true;
        for (var i = 0; i < windowsA.length; i++) {
          for (var j = 0; j < windowsB.length; j++) {
            var a = windowsA[i];
            var b = windowsB[j];
            if (a.date === b.date && minutesRangesOverlap(a.startMin, a.endMin, b.startMin, b.endMin)) {
              return true;
            }
          }
        }
        return false;
      }

      function businessHourWindowsOverlap(ruleA, ruleB, schedules) {
        if (!ruleA.enableTimeSettings || !ruleB.enableTimeSettings) return true;
        var idsA = ruleA.selectedBusinessHourIds || [];
        var idsB = ruleB.selectedBusinessHourIds || [];
        if (!idsA.length || !idsB.length) return true;
        var map = {};
        (schedules || []).forEach(function (s) { map[s.id] = s; });
        for (var i = 0; i < idsA.length; i++) {
          var sa = map[idsA[i]];
          if (!sa) return true;
          for (var j = 0; j < idsB.length; j++) {
            var sb = map[idsB[j]];
            if (!sb) return true;
            if (scheduleWindowsOverlap(sa, sb)) return true;
          }
        }
        return false;
      }

      function memberScopesOverlap(ruleA, ruleB) {
        if (!ruleA.enableMemberLevels || !ruleB.enableMemberLevels) return true;
        var setA = {};
        (ruleA.memberLevels || []).forEach(function (id) { setA[id] = true; });
        return (ruleB.memberLevels || []).some(function (id) { return !!setA[id]; });
      }

      function ruleTypeKey(rule) {
        return String(rule.type || "") + "|" + String(rule.round || "") + "|" + String(rule.method || "");
      }

      function findSharedDishTarget(targetsA, targetsB) {
        var map = {};
        (targetsA || []).forEach(function (t) { map[t.targetKey] = t; });
        for (var i = 0; i < (targetsB || []).length; i++) {
          var hit = map[targetsB[i].targetKey];
          if (hit) return hit;
        }
        return null;
      }

      function findRuleConflict(candidate, rules, editingRuleId) {
        if (!candidate || candidate.status !== "active") return null;
        var candidateTargets = expandRuleDishTargets(candidate);
        if (!candidateTargets.length) return null;
        var schedules = readBusinessHourSchedulesFromStore();
        for (var i = 0; i < (rules || []).length; i++) {
          var existing = rules[i];
          if (!existing) continue;
          if (editingRuleId != null && existing.id === editingRuleId) continue;
          if (existing.status !== "active") continue;
          var shared = findSharedDishTarget(candidateTargets, expandRuleDishTargets(existing));
          if (!shared) continue;
          if (String(candidate.round) !== String(existing.round)) {
            return {
              kind: "round",
              existingRuleId: existing.id,
              existingRuleName: existing.name,
              dishName: shared.dishName,
              candidateRound: candidate.round,
              existingRound: existing.round
            };
          }
          if (ruleTypeKey(candidate) === ruleTypeKey(existing)) {
            if (
              memberScopesOverlap(candidate, existing) &&
              businessHourWindowsOverlap(candidate, existing, schedules)
            ) {
              return {
                kind: "sameTypeScope",
                existingRuleId: existing.id,
                existingRuleName: existing.name,
                dishName: shared.dishName,
                candidateRound: candidate.round,
                existingRound: existing.round
              };
            }
          }
        }
        return null;
      }

      function formatRuleConflict(conflict) {
        if (!conflict) return "规则冲突";
        if (conflict.kind === "round") {
          return "「" + conflict.dishName + "」已在规则「" + conflict.existingRuleName +
            "」中使用「" + conflict.existingRound + "」，不可再设置为「" + conflict.candidateRound + "」";
        }
        return "「" + conflict.dishName + "」与规则「" + conflict.existingRuleName +
          "」的规则类型相同，且时间和会员范围均有重叠";
      }

      function getCategoryIdByName(name) {
        var c = dishCategories.find(function (x) { return x.name === name; });
        return c ? c.id : undefined;
      }
      function getRoundSettings(rule, round, personCount) {
        var ranges = rule.personRanges || [];
        var prIdx = findPersonRangeIndexByCount(ranges, personCount);
        if (prIdx < 0) {
          return {
            roundName: "人数未覆盖",
            selectedCategories: rule.selectedCategories || [],
            selectedDishes: rule.selectedDishes || [],
            quantitySettings: {},
            unavailable: true,
            unavailableReason: "当前就餐人数未命中规则的人数区间"
          };
        }
        var pr = ranges[prIdx];
        var isMultiRound = rule.round === "多轮";
        if (isMultiRound) {
          var roundRanges = normalizeRoundRangesList(rule.roundRanges && rule.roundRanges.length ? rule.roundRanges : rule.rounds);
          var rrIdx = findRoundRangeIndexByRound(roundRanges, round);
          var rq = rrIdx >= 0 ? (pr.roundQuantities || [])[rrIdx] : null;
          if (rrIdx < 0 || !rq) {
            return {
              roundName: "轮次未覆盖",
              selectedCategories: rule.selectedCategories || [],
              selectedDishes: rule.selectedDishes || [],
              quantitySettings: {},
              unavailable: true,
              unavailableReason: "第 " + round + " 轮未命中规则的轮次区间"
            };
          }
          return {
            roundName: formatRoundRangeLabel(roundRanges[rrIdx]),
            selectedCategories: rule.selectedCategories || [],
            selectedDishes: rule.selectedDishes || [],
            quantitySettings: rq.quantitySettings || {},
            maxSameDishSettings: rule.maxSameDishSettings,
            minTotalQuantity: rule.minTotalQuantity,
            maxTotalQuantity: rule.maxTotalQuantity,
            minPerPersonQuantity: rule.minPerPersonQuantity,
            maxPerPersonQuantity: rule.maxPerPersonQuantity,
            minSingleOrder: rule.minSingleOrder,
            maxSingleOrder: rule.maxSingleOrder
          };
        }
        return {
          roundName: "单轮",
          selectedCategories: rule.selectedCategories || [],
          selectedDishes: rule.selectedDishes || [],
          quantitySettings: pr.quantitySettings || rule.quantitySettings || {},
          maxSameDishSettings: rule.maxSameDishSettings,
          minTotalQuantity: rule.minTotalQuantity,
          maxTotalQuantity: rule.maxTotalQuantity,
          minPerPersonQuantity: rule.minPerPersonQuantity,
          maxPerPersonQuantity: rule.maxPerPersonQuantity,
          minSingleOrder: rule.minSingleOrder,
          maxSingleOrder: rule.maxSingleOrder
        };
      }
      function validateOrderItem(rule, newItem, ctx) {
        var violations = [];
        var personCount = ctx.personCount;
        var currentRoundItems = ctx.currentRoundItems;
        var isPerTable = rule.type === "按桌/订单限购";
        var settings = getRoundSettings(rule, newItem.round, personCount);

        if (settings.unavailable) {
          violations.push({ type: "error", message: settings.unavailableReason || ("第 " + newItem.round + " 轮未配置限购数量，无法下单") });
          return violations;
        }
        if (rule.maxRounds !== undefined && newItem.round > rule.maxRounds) {
          violations.push({ type: "error", message: "该规则仅在第 1–" + rule.maxRounds + " 轮生效，当前为第 " + newItem.round + " 轮，无法下单" });
          return violations;
        }
        if (settings.maxTotalQuantity !== undefined) {
          var currentTotal = currentRoundItems.reduce(function (s, i) { return s + i.quantity; }, 0);
          var newTotal = currentTotal + newItem.quantity;
          if (newTotal > settings.maxTotalQuantity) {
            violations.push({ type: "error", message: "每轮总数量不能超过 " + settings.maxTotalQuantity + " 份（当前 " + currentTotal + " 份，拟加 " + newItem.quantity + " 份）" });
          }
        }
        if (isPerTable && settings.maxPerPersonQuantity !== undefined && personCount > 0) {
          var cur = currentRoundItems.reduce(function (s, i) { return s + i.quantity; }, 0);
          var next = cur + newItem.quantity;
          var perPerson = Math.ceil(next / personCount);
          if (perPerson > settings.maxPerPersonQuantity) {
            violations.push({ type: "error", message: "每人每轮不能超过 " + settings.maxPerPersonQuantity + " 份（当前约 " + Math.ceil(cur / personCount) + " 份/人）" });
          }
        }
        if (isPerTable && settings.maxSingleOrder !== undefined && newItem.quantity > settings.maxSingleOrder) {
          violations.push({ type: "error", message: "单次下单不能超过 " + settings.maxSingleOrder + " 份" });
        }
        if (rule.method === "按每种菜品限购") {
          var maxSameDish = settings.quantitySettings["dish_" + newItem.dishId];
          if (maxSameDish !== undefined) {
            var existing = currentRoundItems.find(function (i) { return i.dishId === newItem.dishId; });
            var currentQ = existing ? existing.quantity : 0;
            var nextQ = currentQ + newItem.quantity;
            if (nextQ > maxSameDish) {
              violations.push({ type: "error", message: newItem.dishName + (isPerTable ? "每桌" : "每人") + "每轮限购 " + maxSameDish + " 份（已点 " + currentQ + " 份）", dishName: newItem.dishName });
            }
          }
        }
        if (rule.method === "按每个分类限购") {
          var categoryId = getCategoryIdByName(newItem.category);
          if (categoryId !== undefined && settings.selectedCategories.indexOf(categoryId) >= 0) {
            var maxCategory = settings.quantitySettings["category_" + categoryId];
            if (maxCategory !== undefined) {
              var categoryTotal = currentRoundItems.filter(function (i) { return i.category === newItem.category; }).reduce(function (s, i) { return s + i.quantity; }, 0);
              var newCategoryTotal = categoryTotal + newItem.quantity;
              if (newCategoryTotal > maxCategory) {
                violations.push({ type: "error", message: newItem.category + " 限购 " + maxCategory + " 份（当前 " + categoryTotal + " 份）" });
              }
            }
            var maxSame = settings.maxSameDishSettings && settings.maxSameDishSettings["category_" + categoryId];
            if (maxSame !== undefined) {
              var existing2 = currentRoundItems.find(function (i) { return i.dishId === newItem.dishId; });
              var currentQ2 = existing2 ? existing2.quantity : 0;
              var nextQ2 = currentQ2 + newItem.quantity;
              if (nextQ2 > maxSame) {
                violations.push({ type: "error", message: newItem.dishName + " 限购 " + maxSame + " 份（已点 " + currentQ2 + " 份）", dishName: newItem.dishName });
              }
            }
          }
        }
        return violations;
      }
      function canAddDish(rule, newItem, ctx) {
        if (!rule || rule.status !== "active") return { canAdd: true };
        var violations = validateOrderItem(rule, newItem, ctx);
        if (violations.length > 0) return { canAdd: false, reason: violations[0].message };
        return { canAdd: true };
      }

      function loadRules() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return initialRules();
          var parsed = JSON.parse(raw);
          return Array.isArray(parsed) && parsed.length > 0 ? parsed : initialRules();
        } catch (e) {
          return initialRules();
        }
      }
      function saveRules(rules) { localStorage.setItem(STORAGE_KEY, JSON.stringify(rules)); }
      function nextRuleId(rules) { return rules.reduce(function (m, r) { return Math.max(m, r.id); }, 0) + 1; }
      function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

          orderItems: [],

      }

            ? rule.memberLevels.map(function (id) {
                var lv = memberLevels.find(function (m) { return m.id === id; });
                return lv ? (lv.icon + " " + lv.name) : id;
              }).join("、")
            : "全部";
          var descTxt = String(rule.description || "").trim();
          return (

              "<td><div style='font-weight:600;'>" + esc(rule.name) + "</div></td>" +

              "<td><span class='sub' style='font-size:12px;color:#374151;'>" + esc(rule.type + " · " + rule.round + " · " + rule.method) + "</span></td>" +

      function renderSimulatorDishGrid() {
        var grid = document.getElementById("simDishGrid");

        var filtered = state.sim.activeCategory === "all"

          : dishes.filter(function (d) { return d.category === state.sim.activeCategory; });
        var roundItems = state.sim.orderItems.filter(function (i) { return i.round === state.sim.currentRound; });
        var html = filtered.map(function (dish) {
          var existing = roundItems.find(function (i) { return i.dishId === dish.id; });
          var qty = existing ? existing.quantity : 0;
          var probe = {
            dishId: dish.id,
            dishName: dish.name,
            category: dish.category,
            price: dish.price,
            quantity: 1,
            round: state.sim.currentRound
          };
          var check = canAddDish(selectedRule, probe, { personCount: state.sim.personCount, currentRoundItems: roundItems });
          var blocked = !!selectedRule && !check.canAdd && qty === 0;
          return (
            "<article class='dish-card" + (blocked ? " blocked" : "") + "'>" +
              "<div class='dish-top'><div><div class='dish-name'>" + esc(dish.name) + "</div><div class='dish-meta'>" + esc(dish.description || "") + "</div></div><div class='dish-price'>" + esc(dish.price) + "</div></div>" +

              "<div class='qty-row'>" +
                "<button class='qty-btn' data-dish-op='minus' data-dish-id='" + dish.id + "'" + (qty <= 0 ? " disabled" : "") + ">−</button>" +
                "<span class='qty-num'>" + qty + "</span>" +

              "</div>" +
            "</article>"
          );

        grid.innerHTML = html.join("");

      function renderSimulatorOrder() {
        var roundItems = state.sim.orderItems.filter(function (i) { return i.round === state.sim.currentRound; });
        var roundTotal = roundItems.reduce(function (s, i) { return s + i.quantity; }, 0);
        var allTotal = state.sim.orderItems.reduce(function (s, i) { return s + i.quantity; }, 0);

            return (
              "<div class='order-item'>" +

                "<div style='display:flex;align-items:center;gap:6px;'>" +

      function renderWizardSteps() {

          return "<div class='" + cls + "'><div class='step-dot'>" + (n < state.draft.step ? "✓" : n) + "</div><div class='step-text'>" + esc(label) + "</div></div>";

          "</div></div>" +
          "<div class='wizard-sec wizard-sec--plain'><h4>限购轮次</h4><div class='choice-grid three'>" +
            choice("round", "perRound", draft.round, "每轮", "每轮独立计算") +
            choice("round", "multiRound", draft.round, "多轮", "按轮次区间设不同数量") +
            choice("round", "ignoreRound", draft.round, "与轮次无关", "全程总量限制") +
          "</div></div>" +
          "<div class='wizard-sec wizard-sec--plain'><h4>限购方式</h4><div class='choice-grid'>" +
            choice("method", "perCategory", draft.method, "按分类限购", "按菜品分类设限") +
