<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>自助餐规则</title>
  <link rel="stylesheet" href="assets/common.css" />
  <script src="assets/embedded-mode.js"></script>
  <script src="assets/app-dialogs.js"></script>
  <style>
    :root{--primary:#1677ff;--border:#e5e7eb;--muted:#6b7280;--bg:#f5f7fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.page{min-height:100vh;padding:20px}.card{overflow:hidden;border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:0 2px 12px rgba(15,23,42,.04)}.head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid #eef2f7}.head h1{margin:0;font-size:18px}.btn{border:1px solid #d9dee8;border-radius:9px;background:#fff;padding:8px 13px;cursor:pointer;white-space:nowrap}.btn:hover{border-color:#aeb7c5;background:#f8fafc}.btn-primary{border-color:var(--primary);background:var(--primary);color:#fff}.body{padding:16px 18px 18px;overflow:auto}.filters{display:grid;grid-template-columns:minmax(190px,1.6fr) repeat(5,minmax(120px,1fr)) auto;gap:10px;align-items:end}.filter{display:grid;gap:5px;min-width:0}.filter>span{font-size:12px;color:var(--muted)}.control{width:100%;height:38px;border:1px solid #d9dee8;border-radius:9px;background:#fff;padding:0 11px;color:#111827}.filter-error{min-height:16px;color:#dc2626;font-size:12px}.subbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:10px 0;border-top:1px solid #f0f2f5}.subbar-left,.subbar-right{display:flex;align-items:center;gap:10px}.count{font-size:13px;color:var(--muted)}.advanced{display:grid;grid-template-columns:minmax(180px,260px) minmax(220px,360px);gap:12px;padding:12px;border:1px solid #e6edf5;border-radius:10px;background:#fafcff}.advanced[hidden]{display:none}.settings{position:relative}.settings-panel{position:absolute;z-index:20;right:0;top:calc(100% + 8px);width:min(520px,calc(100vw - 48px));max-height:min(600px,calc(100vh - 160px));overflow:auto;border:1px solid var(--border);border-radius:12px;background:#fff;padding:14px;box-shadow:0 16px 42px rgba(15,23,42,.18)}.settings-panel[hidden]{display:none}.settings-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.column-group+.column-group{margin-top:14px;padding-top:12px;border-top:1px solid #eef2f7}.column-group-title{margin-bottom:8px;font-size:12px;font-weight:650;color:var(--muted)}.column-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}.column-option{display:flex;align-items:center;gap:7px;font-size:13px}.column-option.is-fixed{color:#9ca3af}.rule-group{padding-top:18px}.rule-group-title{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:15px;font-weight:650}.rule-group-count{font-size:12px;font-weight:400;color:#8b95a7}.table-scroll{overflow-x:auto;border:1px solid #eef2f7;border-radius:10px}.rules-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}.rules-table th,.rules-table td{padding:13px 10px;border-bottom:1px solid #eef2f7;text-align:left;vertical-align:top;background:#fff}.rules-table th{color:var(--muted);font-size:12px;font-weight:500;background:#fafcff;white-space:nowrap}.rules-table tr:last-child td{border-bottom:0}.rules-table th.sticky-left,.rules-table td.sticky-left{position:sticky;left:0;z-index:2}.rules-table th.sticky-right,.rules-table td.sticky-right{position:sticky;right:0;z-index:2}.rules-table th.sticky-status,.rules-table td.sticky-status{position:sticky;right:260px;z-index:2}.rules-table th{z-index:3!important}.name-cell{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.name{border:0;background:none;padding:0;color:var(--primary);font-weight:600;cursor:pointer;text-align:left}.system-badge{display:inline-flex;border:1px solid #bae0ff;border-radius:999px;padding:1px 7px;background:#e6f4ff;color:var(--primary);font-size:11px;line-height:18px}.cell-sub{margin-top:3px;color:var(--muted);font-size:12px;line-height:1.4}.badge{display:inline-flex;border-radius:999px;padding:3px 9px}.badge.active{background:#dcfce7;color:#166534}.badge.disabled{background:#fee2e2;color:#991b1b}.badge.draft{background:#fff7e6;color:#ad6800}.ops{display:flex;gap:7px;flex-wrap:wrap;width:240px}.empty{padding:64px 20px;text-align:center;color:var(--muted)}.empty p{margin:8px 0 14px}.capability-id{color:var(--primary);font-weight:650}.coverage{display:inline-flex;border-radius:999px;padding:3px 9px;background:#eef6ff;color:#0958d9}html.embedded-mode,html.embedded-mode body{height:100%;overflow:hidden;background:transparent}html.embedded-mode .page{height:100%;min-height:0;padding:0}html.embedded-mode .card{height:100%;display:flex;flex-direction:column;border:0;border-radius:0;box-shadow:none}html.embedded-mode .body{min-height:0;flex:1}@media(max-width:1180px){.filters{grid-template-columns:repeat(3,minmax(150px,1fr))}.advanced{grid-template-columns:1fr 1fr}}@media(max-width:720px){.filters,.advanced{grid-template-columns:1fr}.subbar{align-items:flex-start;flex-direction:column}.subbar-right{width:100%;justify-content:space-between}}
  </style>
</head>
<body>
  <main class="page"><section class="card"><header class="head"><h1>自助餐规则</h1><button class="btn btn-primary" id="createRule">＋ 新增规则</button></header><div class="body"><section class="filters" aria-label="规则筛选"><label class="filter"><span>规则搜索</span><input class="control" type="search" id="filterKeyword" placeholder="搜索规则名称或 KPOS 能力" /></label><label class="filter"><span>门店</span><select class="control" id="filterStore"></select></label><label class="filter"><span>状态</span><select class="control" id="filterStatus"><option value="">全部状态</option><option value="active">已启用</option><option value="disabled">已禁用</option><option value="draft">草稿</option></select></label><label class="filter"><span>限购主体</span><select class="control" id="filterSubject"><option value="">全部主体</option><option value="order">按桌/订单</option><option value="party_size">按人数</option></select></label><label class="filter"><span>额度周期</span><select class="control" id="filterPeriod"><option value="">全部周期</option><option value="order_lifetime">整个订单</option><option value="per_round">每轮</option><option value="multi_round">多轮</option></select></label><label class="filter"><span>限购对象</span><select class="control" id="filterTarget"><option value="">全部对象</option><option value="dish">菜品</option><option value="category">分类</option><option value="dish_set">菜品集</option></select></label><button class="btn" id="resetFilters">重置</button></section><div class="subbar"><div class="subbar-left"><button class="btn" id="toggleAdvanced" aria-expanded="false">高级筛选</button><span class="count" id="resultCount"></span></div><div class="subbar-right"><div class="settings"><button class="btn" id="toggleColumns" aria-expanded="false">字段设置</button><div class="settings-panel" id="columnPanel" hidden></div></div></div></div><section class="advanced" id="advancedFilters" hidden><label class="filter"><span>实际就餐人数</span><input class="control" id="filterPartySize" type="number" min="1" step="1" placeholder="输入人数" /><span class="filter-error" id="partyError"></span></label><label class="filter"><span>生效时间</span><select class="control" id="filterTime"></select></label></section><div id="ruleList"></div></div></section></main>
  <script src="assets/order-limit-store-catalog.js"></script>
  <script src="assets/buffet-rule-policy.js"></script>
  <script src="assets/buffet-rule-domain.js"></script>
  <script src="assets/buffet-rule-profile.js"></script>
  <script src="assets/buffet-rule-list-view.js"></script>
  <script>
    (function(){
      var profile=window.ORDER_LIMIT_MODULE_PROFILE,repo=profile.repository,view=window.BuffetRuleListView,stores=window.OrderLimitStoreCatalog||[],list=document.getElementById("ruleList"),rawRows=[],rows=[],options={stores:[],times:[]};
      var state={filters:{keyword:"",storeId:"",status:"",subject:"",period:"",targetType:"",partySize:"",effectiveTimeKey:""},advancedOpen:false,columnsOpen:false,visibleColumns:loadColumns()};
      var columnMap={};view.columnDefinitions().forEach(function(column){columnMap[column.id]=column});
      function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
      function go(url){location.href=window.appendMenusifuEmbeddedParam?window.appendMenusifuEmbeddedParam(url):url}
      function records(){try{return repo.loadForAuthoringList(profile.createDefaultScenarioRule)}catch(e){list.innerHTML='<div class="empty"><strong>数据无法读取</strong><p>'+esc(e.message)+'</p></div>';return[]}}
      function loadColumns(){try{return view.normalizeColumnPreference(JSON.parse(localStorage.getItem(profile.storage.listColumnsKey)||"null")).visible}catch(e){return view.defaultVisibleColumns()}}
      function saveColumns(){localStorage.setItem(profile.storage.listColumnsKey,JSON.stringify({version:1,visible:state.visibleColumns}))}
      function selectOptions(el,first,items,value,key,label){el.innerHTML='<option value="">'+first+'</option>'+items.map(function(item){return'<option value="'+esc(item[key])+'"'+(String(item[key])===String(value)?' selected':'')+'>'+esc(item[label])+'</option>'}).join('')}
      function refreshDynamicOptions(){selectOptions(document.getElementById('filterStore'),'全部门店',options.stores,state.filters.storeId,'id','name');selectOptions(document.getElementById('filterTime'),'全部时间',options.times,state.filters.effectiveTimeKey,'key','label')}
      function cellHtml(columnId,row){var cells=view.projectColumns(row),cell=cells[columnId]||{main:'—'},sticky=columnId==='name'?' sticky-left':columnId==='status'?' sticky-status':columnId==='actions'?' sticky-right':'';if(columnId==='name')return'<td class="'+sticky+'"><div class="name-cell"><button class="name" data-view="'+esc(row.id)+'">'+esc(row.name)+'</button>'+(row.isSystemDefault?'<span class="system-badge">系统默认</span>':'')+'</div></td>';if(columnId==='status')return'<td class="'+sticky+'"><span class="badge '+esc(row.status)+'">'+esc(cell.main)+'</span></td>';if(columnId==='actions'){var formal=row.status!=="draft";return'<td class="'+sticky+'"><div class="ops"><button class="btn" data-edit="'+esc(row.id)+'">'+(row.status==='draft'?'继续编辑':'编辑')+'</button>'+(formal?'<button class="btn" data-copy="'+esc(row.id)+'">复制</button><button class="btn" data-toggle="'+esc(row.id)+'">'+(row.status==='active'?'禁用':'启用')+'</button>':'')+'<button class="btn" data-delete="'+esc(row.id)+'">删除</button></div></td>'}if(columnId==='legacyCapabilities'){var content=row.legacyCapabilities.map(function(item){return'<div><span class="capability-id">'+esc(item.id)+'</span> '+esc(item.label)+'</div>'}).join('')||'—';return'<td>'+content+'</td>'}if(columnId==='coverage')return'<td>'+(cell.main==='—'?'—':'<span class="coverage">'+esc(cell.main)+'</span>')+'</td>';return'<td><div>'+esc(cell.main)+'</div>'+(cell.sub?'<div class="cell-sub">'+esc(cell.sub)+'</div>':'')+'</td>'}
      function tableHtml(groupRows){var columns=state.visibleColumns.map(function(id){return columnMap[id]}).filter(Boolean);return'<div class="table-scroll"><table class="rules-table" style="min-width:'+columns.reduce(function(sum,column){return sum+column.width},0)+'px"><thead><tr>'+columns.map(function(column){var sticky=column.id==='name'?' sticky-left':column.id==='status'?' sticky-status':column.id==='actions'?' sticky-right':'';return'<th class="'+sticky+'" style="width:'+column.width+'px">'+esc(column.label)+'</th>'}).join('')+'</tr></thead><tbody>'+groupRows.map(function(row){return'<tr>'+columns.map(function(column){return cellHtml(column.id,row)}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}
      function groupHtml(title,groupRows){return groupRows.length?'<section class="rule-group"><h2 class="rule-group-title">'+esc(title)+'<span class="rule-group-count">'+groupRows.length+' 条</span></h2>'+tableHtml(groupRows)+'</section>':''}
      function renderColumns(){var panel=document.getElementById('columnPanel'),defs=view.columnDefinitions();panel.innerHTML='<div class="settings-head"><strong>字段设置</strong><button class="btn" data-columns-default>恢复默认</button></div>'+[{id:'default',label:'默认字段',columns:defs.filter(function(column){return column.defaultVisible})}].concat(view.columnGroups.map(function(group){return{id:group.id,label:group.label,columns:group.columns.map(function(pair){return defs.find(function(column){return column.id===pair[0]})})}})).map(function(group){return'<section class="column-group"><div class="column-group-title">'+esc(group.label)+'</div><div class="column-options">'+group.columns.filter(Boolean).map(function(column){var checked=state.visibleColumns.indexOf(column.id)>=0;return'<label class="column-option'+(column.fixed?' is-fixed':'')+'"><input type="checkbox" data-column="'+esc(column.id)+'"'+(checked?' checked':'')+(column.fixed?' disabled':'')+' /><span>'+esc(column.label)+'</span></label>'}).join('')+'</div></section>'}).join('')}
      function render(){var filtered=view.filterRows(rows,state.filters),groups=view.groupRows(filtered),normalized=view.normalizeFilters(state.filters);document.getElementById('resultCount').textContent='筛选 '+filtered.length+' / 共 '+rows.length+' 条';document.getElementById('partyError').textContent=normalized.partyInvalid?'请输入大于等于 1 的整数':'';document.getElementById('advancedFilters').hidden=!state.advancedOpen;document.getElementById('toggleAdvanced').setAttribute('aria-expanded',String(state.advancedOpen));document.getElementById('columnPanel').hidden=!state.columnsOpen;document.getElementById('toggleColumns').setAttribute('aria-expanded',String(state.columnsOpen));renderColumns();if(!rows.length){list.innerHTML='<div class="empty"><strong>暂无自助餐规则</strong><p>点击“新增规则”开始配置。</p></div>';return}if(!filtered.length){list.innerHTML='<div class="empty"><strong>暂无匹配规则</strong><p>请调整筛选条件后重试。</p><button class="btn" data-empty-reset>重置筛选</button></div>';return}list.innerHTML=groupHtml('整单限制',groups.order_lifetime)+groupHtml('每轮常用组合模板',groups.per_round_combo)+groupHtml('每轮原子规则',groups.per_round)+groupHtml('其他规则',groups.custom)}
      function reload(){rawRows=records();rows=rawRows.map(function(record){return view.createViewModel(record,profile,stores)});options=view.buildFilterOptions(rows,stores);refreshDynamicOptions();render()}
      function reset(){state.filters={keyword:"",storeId:"",status:"",subject:"",period:"",targetType:"",partySize:"",effectiveTimeKey:""};state.advancedOpen=false;document.getElementById('filterKeyword').value='';document.getElementById('filterStatus').value='';document.getElementById('filterSubject').value='';document.getElementById('filterPeriod').value='';document.getElementById('filterTarget').value='';document.getElementById('filterPartySize').value='';refreshDynamicOptions();render()}
      function find(id,items){return items.find(function(record){return String(record.id)===String(id)})}
      function save(items,message){repo.saveRules(items);if(message)AppDialogs.showToast(message,{variant:"success"});reload()}
      function templateForRecord(record){return view.createViewModel(record,profile,stores).isSystemDefault}
      function toggle(id){var items=records(),rule=find(id,items);if(!rule)return;if(rule.status==='active'){rule.status='disabled';save(items,'规则已禁用');return}var check=profile.lifecycle&&profile.lifecycle.validateActivation?profile.lifecycle.validateActivation(rule,items):null;if(!check&&window.BuffetRuleDomain&&window.BuffetRuleDomain.findConflict){var config=rule.authoringConfig||rule.authoringDraft||rule.editorDraft||rule;check=window.BuffetRuleDomain.findConflict(config,items,[rule.id])?{valid:false,message:'当前规则与已启用规则存在冲突'}:{valid:true,message:''}}if(!check||!check.valid){AppDialogs.showToast((check&&check.message)||'无法校验规则完整性',{variant:'error'});return}if(profile.lifecycle&&profile.lifecycle.prepareActivation)profile.lifecycle.prepareActivation(rule);rule.status='active';save(items,'规则已启用')}
      function remove(id){var items=records(),rule=find(id,items);if(!rule)return;var message=templateForRecord(rule)?'删除后，下次进入列表会恢复为空白且禁用的默认规则；当前配置不会保留。确定删除？':'删除后无法恢复，确定删除该自助餐规则？';void AppDialogs.confirm({title:'确认删除',message:message,confirmLabel:'确认删除',danger:true}).then(function(ok){if(ok)save(items.filter(function(item){return String(item.id)!==String(id)}),'规则已删除')})}
      [['filterKeyword','keyword','input'],['filterStore','storeId','change'],['filterStatus','status','change'],['filterSubject','subject','change'],['filterPeriod','period','change'],['filterTarget','targetType','change'],['filterPartySize','partySize','input'],['filterTime','effectiveTimeKey','change']].forEach(function(binding){document.getElementById(binding[0]).addEventListener(binding[2],function(e){state.filters[binding[1]]=e.target.value;render()})});
      document.getElementById('resetFilters').onclick=reset;document.getElementById('toggleAdvanced').onclick=function(){state.advancedOpen=!state.advancedOpen;render()};document.getElementById('toggleColumns').onclick=function(){state.columnsOpen=!state.columnsOpen;render()};document.getElementById('createRule').onclick=function(){go(profile.routes.editor+'?mode=create')};
      document.getElementById('columnPanel').onclick=function(e){var resetButton=e.target.closest('[data-columns-default]');if(resetButton){state.visibleColumns=view.defaultVisibleColumns();saveColumns();render();return}var input=e.target.closest('[data-column]');if(!input)return;var id=input.dataset.column;if(input.checked&&state.visibleColumns.indexOf(id)<0)state.visibleColumns.push(id);if(!input.checked)state.visibleColumns=state.visibleColumns.filter(function(value){return value!==id});state.visibleColumns=view.normalizeColumnPreference({version:1,visible:state.visibleColumns}).visible;saveColumns();render()};
      list.onclick=function(e){if(e.target.closest('[data-empty-reset]')){reset();return}var target=e.target.closest('[data-view],[data-edit],[data-copy],[data-toggle],[data-delete]');if(!target)return;if(target.dataset.view)go(profile.routes.editor+'?ruleId='+target.dataset.view+'&view=1');else if(target.dataset.edit)go(profile.routes.editor+'?'+(target.textContent==='继续编辑'?'draftId=':'ruleId=')+target.dataset.edit);else if(target.dataset.copy)go(profile.routes.editor+'?ruleId='+target.dataset.copy+'&copy=1');else if(target.dataset.toggle)toggle(target.dataset.toggle);else if(target.dataset.delete)remove(target.dataset.delete)};
      document.addEventListener('click',function(e){if(state.columnsOpen&&!e.target.closest('.settings')){state.columnsOpen=false;render()}});window.__BUFFET_RULE_LIST_TEST_API__={state:state,reload:reload,reset:reset};reload();
    })();
  </script>
</body>
</html>
