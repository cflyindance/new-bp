<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>自助餐规则</title>
  <link rel="stylesheet" href="assets/common.css" />
  <script src="assets/embedded-mode.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.page{min-height:100vh;padding:20px}.card{overflow:hidden;border:1px solid #e5e7eb;border-radius:14px;background:#fff;box-shadow:0 2px 12px rgba(15,23,42,.04)}.head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid #eef2f7}.head h1{margin:0;font-size:18px}.btn{border:1px solid #d9dee8;border-radius:9px;background:#fff;padding:8px 13px;cursor:pointer}.btn-primary{border-color:#1677ff;background:#1677ff;color:#fff}.body{padding:0 18px 18px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:13px 8px;border-bottom:1px solid #eef2f7;text-align:left}th{color:#6b7280;font-size:12px;font-weight:500;background:#fafcff}.name{border:0;background:none;padding:0;color:#1677ff;font-weight:600;cursor:pointer}.badge{display:inline-flex;border-radius:999px;padding:3px 9px;background:#dcfce7;color:#166534}.badge.draft{background:#fff7e6;color:#ad6800}.empty{padding:64px 20px;text-align:center;color:#6b7280}.ops{display:flex;gap:7px;flex-wrap:wrap}html.embedded-mode,html.embedded-mode body{height:100%;overflow:hidden;background:transparent}html.embedded-mode .page{height:100%;min-height:0;padding:0}html.embedded-mode .card{height:100%;display:flex;flex-direction:column;border:0;border-radius:0;box-shadow:none}html.embedded-mode .body{min-height:0;flex:1}
  </style>
</head>
<body>
  <main class="page"><section class="card"><header class="head"><h1>自助餐规则</h1><button class="btn btn-primary" id="createRule">＋ 新增规则</button></header><div class="body" id="ruleList"></div></section></main>
  <script src="assets/buffet-rule-domain.js"></script>
  <script src="assets/buffet-rule-profile.js"></script>
  <script>
    (function(){
      var profile=window.ORDER_LIMIT_MODULE_PROFILE,repo=profile.repository,list=document.getElementById("ruleList");
      function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
      function go(url){location.href=window.appendMenusifuEmbeddedParam?window.appendMenusifuEmbeddedParam(url):url}
      function records(){try{return repo.loadRules()}catch(e){list.innerHTML='<div class="empty"><strong>数据无法读取</strong><p>'+esc(e.message)+'</p></div>';return[]}}
      function render(){var rows=records();if(!rows.length){list.innerHTML='<div class="empty"><strong>暂无自助餐规则</strong><p>点击“新增规则”开始配置。</p></div>';return}list.innerHTML='<table><thead><tr><th>规则名称</th><th>计算方式</th><th>生效门店</th><th>状态</th><th>操作</th></tr></thead><tbody>'+rows.map(function(r){var d=r.authoringConfig||r.authoringDraft||r.editorDraft||{};return'<tr><td><button class="name" data-view="'+esc(r.id)+'">'+esc(d.name||r.name||'未命名规则')+'</button></td><td>'+esc((d.subject==='party_size'?'按人数':'按桌/订单')+' · '+(d.period==='multi_round'?'分轮次':d.period==='per_round'?'每轮':'每单/整单')+' · '+(d.targetType==='dish'?'按菜品':'按分类'))+'</td><td>'+esc((d.deployStoreIds||[]).length)+' 家</td><td><span class="badge '+(r.status==='draft'?'draft':'')+'">'+esc(r.status==='draft'?'草稿':r.status==='disabled'?'已禁用':'已启用')+'</span></td><td><div class="ops"><button class="btn" data-edit="'+esc(r.id)+'">'+(r.status==='draft'?'继续编辑':'编辑')+'</button></div></td></tr>'}).join('')+'</tbody></table>'}
      document.getElementById("createRule").onclick=function(){go(profile.routes.editor+'?mode=create')};
      list.onclick=function(e){var view=e.target.closest('[data-view]'),edit=e.target.closest('[data-edit]');if(view)go(profile.routes.editor+'?ruleId='+view.dataset.view+'&view=1');if(edit)go(profile.routes.editor+'?'+(edit.textContent==='继续编辑'?'draftId=':'ruleId=')+edit.dataset.edit)};
      render();
    })();
  </script>
</body>
</html>
