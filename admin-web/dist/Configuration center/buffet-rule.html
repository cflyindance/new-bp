<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>自助餐规则</title>
  <link rel="stylesheet" href="assets/common.css" />
  <script src="assets/embedded-mode.js"></script>
  <script src="assets/app-dialogs.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.page{min-height:100vh;padding:20px}.card{overflow:hidden;border:1px solid #e5e7eb;border-radius:14px;background:#fff;box-shadow:0 2px 12px rgba(15,23,42,.04)}.head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid #eef2f7}.head h1{margin:0;font-size:18px}.btn{border:1px solid #d9dee8;border-radius:9px;background:#fff;padding:8px 13px;cursor:pointer}.btn-primary{border-color:#1677ff;background:#1677ff;color:#fff}.body{padding:0 18px 18px;overflow:auto}.rule-group{padding-top:18px}.rule-group-title{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:15px;font-weight:650;color:#111827}.rule-group-count{font-size:12px;font-weight:400;color:#8b95a7}.coverage-note{display:grid;gap:6px;margin:-2px 0 12px;padding:10px 12px;border:1px solid #ffe7ba;border-radius:8px;background:#fffbe6;color:#874d00;font-size:12px;line-height:1.7}.coverage-note strong{margin-right:5px}.coverage-note-row{display:flex;gap:12px;align-items:flex-start}.coverage-note.evidence{border-color:#d9e6f6;background:#f6faff;color:#315b85}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:13px 8px;border-bottom:1px solid #eef2f7;text-align:left;vertical-align:top}th{color:#6b7280;font-size:12px;font-weight:500;background:#fafcff}.name-cell{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.name{border:0;background:none;padding:0;color:#1677ff;font-weight:600;cursor:pointer}.system-badge{display:inline-flex;border:1px solid #bae0ff;border-radius:999px;padding:2px 7px;background:#e6f4ff;color:#1677ff;font-size:11px;line-height:18px;white-space:nowrap}.capability-list{display:grid;gap:5px;min-width:210px}.capability-id{color:#1677ff;font-weight:600;margin-right:5px}.coverage-status{display:inline-flex;border-radius:999px;padding:3px 9px;white-space:nowrap}.coverage-status.complete{background:#dcfce7;color:#166534}.coverage-status.partial,.coverage-status.redefined{background:#fff7e6;color:#ad6800}.coverage-status.extension{background:#e6f4ff;color:#0958d9}.coverage-status.na{background:#f3f4f6;color:#6b7280}.badge{display:inline-flex;border-radius:999px;padding:3px 9px;background:#dcfce7;color:#166534}.badge.draft{background:#fff7e6;color:#ad6800}.empty{padding:64px 20px;text-align:center;color:#6b7280}.ops{display:flex;gap:7px;flex-wrap:wrap}html.embedded-mode,html.embedded-mode body{height:100%;overflow:hidden;background:transparent}html.embedded-mode .page{height:100%;min-height:0;padding:0}html.embedded-mode .card{height:100%;display:flex;flex-direction:column;border:0;border-radius:0;box-shadow:none}html.embedded-mode .body{min-height:0;flex:1}@media(max-width:1120px){table thead{display:none}table,tbody,tr,td{display:block}tr{padding:12px 0;border-bottom:1px solid #eef2f7}td{padding:5px 8px;border:0}.capability-list{min-width:0}.coverage-note-row{display:block}.ops{margin-top:4px}}
  </style>
</head>
<body>
  <main class="page"><section class="card"><header class="head"><h1>自助餐规则</h1><button class="btn btn-primary" id="createRule">＋ 新增规则</button></header><div class="body" id="ruleList"></div></section></main>
  <script src="assets/buffet-rule-policy.js"></script>
  <script src="assets/buffet-rule-domain.js"></script>
  <script src="assets/buffet-rule-profile.js"></script>
  <script>
    (function(){
      var profile=window.ORDER_LIMIT_MODULE_PROFILE,repo=profile.repository,list=document.getElementById("ruleList");
      function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
      function go(url){location.href=window.appendMenusifuEmbeddedParam?window.appendMenusifuEmbeddedParam(url):url}
      function records(){try{return repo.loadForAuthoringList(profile.createDefaultScenarioRule)}catch(e){list.innerHTML='<div class="empty"><strong>数据无法读取</strong><p>'+esc(e.message)+'</p></div>';return[]}}
      function calculation(d,template){var periods=Array.isArray(d.enabledPeriods)&&d.enabledPeriods.length?d.enabledPeriods:[d.period];var periodText=periods.map(function(p){return p==='multi_round'?'分轮次':p==='per_round'?'每轮':'整个订单'}).join('＋');var target=d.targetType==='dish_set'?'菜品集':d.targetType==='dish'?'菜品':'分类';if(template&&template.group==='per_round_combo')return'按人数区间 · 每轮总量＋'+target+'额度';return(d.subject==='party_size'?'按人数':'按桌/订单')+' · '+target+' · '+periodText}
      function templateFor(record){if(!record||record.origin!=="system_default"||record.status==="draft")return null;var key=String(record.defaultScenarioKey||"");return(profile.defaultScenarios||[]).find(function(item){return item&&item.key===key})||null}
      var statusView={complete:{label:'完整覆盖',tone:'complete'},partial:{label:'部分覆盖',tone:'partial'},product_redefined:{label:'产品重定义后覆盖',tone:'redefined'},defined_extension:{label:'新系统扩展定义',tone:'extension'}};
      function capabilityFor(id){return profile.legacyCapabilities&&profile.legacyCapabilities[id]||{id:id,label:id,coverageStatus:'partial',legacyEvidenceStatus:'pending_runtime'}}
      function capabilityView(record){var template=templateFor(record);if(!template)return{html:'—',status:'—',tone:'na'};var capabilities=(template.legacyCapabilityIds||[]).map(capabilityFor),rows=capabilities.map(function(item){return'<div><span class="capability-id">'+esc(item.id)+'</span>'+esc(item.label||item.id)+'</div>'}),view=statusView[template.coverageStatus]||statusView.complete;return{html:'<div class="capability-list">'+rows.join('')+'</div>',status:view.label,tone:view.tone}}
      function groupNote(group){var registry=(profile.legacyCapabilityGroups||[]).find(function(item){return item&&item.group===group});if(!registry)return'';var capabilities=(registry.capabilityIds||[]).map(function(id){var item=capabilityFor(id),view=statusView[item.coverageStatus]||statusView.complete;return'<div class="coverage-note-row"><strong>'+esc(id)+' '+esc(view.label)+'：</strong><span>'+esc(item.label)+(item.gap?'；'+esc(item.gap):'')+'</span></div>'}).join(''),evidence=(registry.evidenceIds||[]).map(function(id){var item=capabilityFor(id);return'<div class="coverage-note-row"><strong>'+esc(id)+'：</strong><span>'+esc(item.label)+'；旧 KPOS 运行行为待验证；新系统已明确定义'+(item.gap?'（'+esc(item.gap)+'）':'')+'</span></div>'}).join('');return(capabilities?'<div class="coverage-note">'+capabilities+'</div>':'')+(evidence?'<div class="coverage-note evidence">'+evidence+'</div>':'')}
      function groupFor(record){var template=templateFor(record);return template&&(template.group==="order_lifetime"||template.group==="per_round_combo"||template.group==="per_round")?template.group:"custom"}
      function deleteMessageFor(record){return templateFor(record)?'删除后，下次进入列表会恢复为空白且禁用的默认规则；当前商品、数量和生效范围配置不会保留。确定删除？':'删除后无法恢复，确定删除该自助餐规则？'}
      function rowHtml(r){var d=r.authoringConfig||r.authoringDraft||r.editorDraft||{},formal=r.status!=="draft",template=templateFor(r),systemDefault=!!template,coverage=capabilityView(r);return'<tr><td><div class="name-cell"><button class="name" data-view="'+esc(r.id)+'">'+esc(d.name||r.name||'未命名规则')+'</button>'+(systemDefault?'<span class="system-badge">系统默认</span>':'')+'</div></td><td>'+coverage.html+'</td><td>'+esc(calculation(d,template))+'</td><td>'+esc((d.deployStoreIds||[]).length)+' 家</td><td><span class="coverage-status '+coverage.tone+'">'+esc(coverage.status)+'</span></td><td><span class="badge '+(r.status==='draft'?'draft':'')+'">'+esc(r.status==='draft'?'草稿':r.status==='disabled'?'已禁用':'已启用')+'</span></td><td><div class="ops"><button class="btn" data-edit="'+esc(r.id)+'">'+(r.status==='draft'?'继续编辑':'编辑')+'</button>'+(formal?'<button class="btn" data-copy="'+esc(r.id)+'">复制</button><button class="btn" data-toggle="'+esc(r.id)+'">'+(r.status==='active'?'禁用':'启用')+'</button>':'')+'<button class="btn" data-delete="'+esc(r.id)+'">删除</button></div></td></tr>'}
      function groupHtml(title,rows,group){if(!rows.length)return'';var note=group==='custom'||group==='per_round_combo'?'':groupNote(group);return'<section class="rule-group"><h2 class="rule-group-title">'+esc(title)+'<span class="rule-group-count">'+esc(rows.length)+' 条</span></h2>'+note+'<table><thead><tr><th>对应新默认规则</th><th>旧 KPOS 调研能力</th><th>计算方式</th><th>生效门店</th><th>覆盖结果</th><th>状态</th><th>操作</th></tr></thead><tbody>'+rows.map(rowHtml).join('')+'</tbody></table></section>'}
      function render(){var rows=records();if(!rows.length){list.innerHTML='<div class="empty"><strong>暂无自助餐规则</strong><p>点击“新增规则”开始配置。</p></div>';return}var groups={order_lifetime:[],per_round_combo:[],per_round:[],custom:[]};rows.forEach(function(record){groups[groupFor(record)].push(record)});list.innerHTML=groupHtml('整单限制',groups.order_lifetime,'order_lifetime')+groupHtml('每轮常用组合模板',groups.per_round_combo,'per_round_combo')+groupHtml('每轮原子规则',groups.per_round,'per_round')+groupHtml('其他规则',groups.custom,'custom')}
      function find(id,rows){return rows.find(function(r){return String(r.id)===String(id)})}
      function save(rows,message){repo.saveRules(rows);if(message)AppDialogs.showToast(message,{variant:"success"});render()}
      function toggle(id){var rows=records(),rule=find(id,rows);if(!rule)return;if(rule.status==='active'){rule.status='disabled';save(rows,'规则已禁用');return}var check=profile.lifecycle&&profile.lifecycle.validateActivation?profile.lifecycle.validateActivation(rule,rows):null;if(!check&&window.BuffetRuleDomain&&window.BuffetRuleDomain.findConflict){var config=rule.authoringConfig||rule.authoringDraft||rule.editorDraft||rule;check=window.BuffetRuleDomain.findConflict(config,rows,[rule.id])?{valid:false,message:'当前规则与已启用规则存在冲突'}:{valid:true,message:''}}if(!check||!check.valid){AppDialogs.showToast((check&&check.message)||'无法校验规则完整性',{variant:'error'});return}if(profile.lifecycle&&profile.lifecycle.prepareActivation)profile.lifecycle.prepareActivation(rule);rule.status='active';save(rows,'规则已启用')}
      function remove(id){var rows=records(),rule=find(id,rows);if(!rule)return;void AppDialogs.confirm({title:'确认删除',message:deleteMessageFor(rule),confirmLabel:'确认删除',danger:true}).then(function(ok){if(!ok)return;save(rows.filter(function(r){return String(r.id)!==String(id)}),'规则已删除')})}
      window.__BUFFET_RULE_LIST_TEST_API__={groupFor:groupFor,deleteMessageFor:deleteMessageFor,capabilityView:capabilityView};
      document.getElementById("createRule").onclick=function(){go(profile.routes.editor+'?mode=create')};
      list.onclick=function(e){var view=e.target.closest('[data-view]'),edit=e.target.closest('[data-edit]'),copy=e.target.closest('[data-copy]'),toggleButton=e.target.closest('[data-toggle]'),removeButton=e.target.closest('[data-delete]');if(view)go(profile.routes.editor+'?ruleId='+view.dataset.view+'&view=1');else if(edit)go(profile.routes.editor+'?'+(edit.textContent==='继续编辑'?'draftId=':'ruleId=')+edit.dataset.edit);else if(copy)go(profile.routes.editor+'?ruleId='+copy.dataset.copy+'&copy=1');else if(toggleButton)toggle(toggleButton.dataset.toggle);else if(removeButton)remove(removeButton.dataset.delete)};
      render();
    })();
  </script>
</body>
</html>
