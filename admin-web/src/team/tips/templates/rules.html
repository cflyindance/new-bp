<style data-team-tips-view-style>
.pool-type-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .pool-type-option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .pool-type-option:hover {
      border-color: var(--primary);
      background: rgba(22, 119, 255, 0.04);
    }
    .pool-type-option.selected {
      border-color: var(--primary);
      background: rgba(22, 119, 255, 0.08);
      box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.1);
    }
    .pool-type-option input {
      margin-top: 3px;
      accent-color: var(--primary);
      flex-shrink: 0;
    }
    .pool-type-option-text strong {
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
      color: var(--text-primary);
    }
    .pool-type-option-text span {
      font-size: 12px;
      color: var(--text-tertiary);
      line-height: 1.5;
    }
</style>
<section class="team-tips-page tipout-fidelity tipout-page-rules" data-team-tips-view="rules">
<div class="content-area">
        <section class="tipout-page-section" aria-labelledby="rulesTitle">
          <div class="tipout-page-heading">
            <div>
              <h1 id="rulesTitle">分配规则</h1>
            </div>
            <div class="tipout-heading-actions">
              <button type="button" class="btn btn-primary" data-native-onclick="openAddRuleModal()">新增规则</button>
            </div>
          </div>

          <div class="tipout-compact-toolbar tipout-rules-toolbar">
            <label class="filter-field-label" for="storeFilter">门店</label>
            <select class="form-control" id="storeFilter" data-native-onchange="renderRulesTable()">
              <option value="">全部门店</option>
            </select>
          </div>

          <div class="tipout-metric-strip tipout-metric-strip--three" aria-label="规则概览">
            <div><span>规则总数</span><strong id="ruleCount">0</strong></div>
            <div><span>小费池</span><strong id="tipPoolCount">0</strong></div>
            <div><span>加收服务费池</span><strong id="surchargePoolCount">0</strong></div>
          </div>

          <div class="tipout-table-wrap">
            <table class="data-table tipout-rules-table">
              <thead>
                <tr>
                  <th>规则名称</th>
                  <th>门店</th>
                  <th>池类型与规则摘要</th>
                  <th>分配说明</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="rulesTableBody"></tbody>
            </table>
          </div>
        </section>
      </div>
</section>
