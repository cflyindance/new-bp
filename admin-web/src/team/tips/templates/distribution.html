<section class="team-tips-page" data-team-tips-view="distribution">
<div class="content-area">
        <section class="tipout-page-section" aria-labelledby="summaryTitle">
          <div class="tipout-page-heading">
            <div>
              <p class="tipout-kicker">Tip Out 工作台</p>
              <h1 id="summaryTitle">小费分配汇总</h1>
              <p>按日期查看、核对并执行当前范围的小费分配。</p>
            </div>
            <div class="tipout-heading-actions">
              <button id="summaryRuleEntryBtn" type="button" class="btn btn-lg" data-native-onclick="openSummaryRuleEntry()">新建/查看规则</button>
              <div class="export-dropdown">
                <button type="button" class="btn btn-lg" data-native-onclick="toggleExportMenu()" aria-haspopup="menu">导出结果</button>
                <div class="export-menu" id="exportMenu" role="menu">
                  <div class="export-menu-item" data-native-onclick="exportAs('pdf')">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0"><rect x="2" y="1" width="12" height="14" rx="2" stroke="#ff4d4f" stroke-width="1.2"/><text x="8" y="10.5" text-anchor="middle" fill="#ff4d4f" font-size="5" font-weight="600">PDF</text></svg>
                    导出为 PDF
                  </div>
                  <div class="export-menu-item" data-native-onclick="exportAs('csv')">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0"><rect x="2" y="1" width="12" height="14" rx="2" stroke="#52c41a" stroke-width="1.2"/><text x="8" y="10.5" text-anchor="middle" fill="#52c41a" font-size="5" font-weight="600">CSV</text></svg>
                    导出为 CSV
                  </div>
                  <div class="export-menu-item" data-native-onclick="openEmailModal()">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0"><rect x="1.5" y="3" width="13" height="10" rx="2" stroke="#1677ff" stroke-width="1.2"/><path d="M2 4l6 4 6-4" stroke="#1677ff" stroke-width="1.2" stroke-linecap="round"/></svg>
                    发送到邮箱
                  </div>
                </div>
              </div>
              <button id="allocateBtn" class="btn btn-primary btn-lg" data-native-onclick="doAllocateTips()">分配小费</button>
            </div>
          </div>

          <div class="tipout-metric-strip" aria-label="小费金额概览">
            <div><span>分配前</span><strong id="summaryBefore">$0.00</strong></div>
            <div><span>扣除</span><strong id="summaryDeducted">$0.00</strong></div>
            <div><span>分得</span><strong id="summaryReceived">$0.00</strong></div>
            <div class="is-primary"><span>分配后</span><strong id="summaryAfter">$0.00</strong></div>
          </div>

          <div class="tipout-inline-notice tipout-inline-notice--warning" role="status">
            <div>
              <strong>当前范围有 <span id="pendingDateCount">0</span> 天待分配</strong>
              <p>待分配数量只按日期、门店与当前分配记录计算。</p>
            </div>
            <button type="button" class="btn" data-native-onclick="doCancelAllocate()">取消分配</button>
          </div>

          <!-- Filters：移动端默认折叠 -->
          <div class="filter-surface tipout-compact-toolbar">
            <button type="button" class="filter-surface-toggle" data-native-onclick="toggleFilterSurface(this)" aria-expanded="false" aria-controls="indexFilterCollapsible">
              <span class="filter-surface-toggle-text">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
                筛选条件
              </span>
              <svg class="filter-surface-toggle-chevron" width="14" height="14" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M6 8.825a.5.5 0 0 1-.354-.146l-4-4a.5.5 0 0 1 .708-.708L6 7.617l3.646-3.646a.5.5 0 0 1 .708.708l-4 4A.5.5 0 0 1 6 8.825z"/></svg>
            </button>
            <div id="indexFilterCollapsible" class="filter-surface-collapsible">
              <div class="filter-bar filter-bar--page filter-bar--index">
                <div class="filter-field filter-field--daterange">
                  <span class="filter-field-label">日期范围</span>
                  <div class="date-range-group">
                    <input type="date" id="dateStart" class="form-control form-control-lg" value="2026-01-01" data-native-onchange="renderDailySummaryList()">
                    <span class="date-range-sep" style="color:var(--text-tertiary)">~</span>
                    <input type="date" id="dateEnd" class="form-control form-control-lg" value="2026-02-28" data-native-onchange="renderDailySummaryList()">
                  </div>
                </div>
                <div class="filter-field">
                  <label class="filter-field-label" for="storeSelect">门店</label>
                  <select id="storeSelect" class="form-control form-control-lg" data-native-onchange="invalidateDayPipelineCache();renderDailySummaryList()">
                    <option value="">请选择门店</option>
                  </select>
                </div>
                <div class="filter-field">
                  <span class="filter-field-label">角色</span>
                  <div class="multi-select" id="roleFilter" data-placeholder="All Role">
                    <div class="multi-select-input" data-native-onclick="toggleIndexMultiSelect('roleFilter')">
                      <div class="multi-select-tags"><span class="multi-select-placeholder">All Role</span></div>
                      <svg class="multi-select-arrow" width="12" height="12" viewBox="0 0 12 12" fill="#999"><path d="M6 8.825a.5.5 0 0 1-.354-.146l-4-4a.5.5 0 0 1 .708-.708L6 7.617l3.646-3.646a.5.5 0 0 1 .708.708l-4 4A.5.5 0 0 1 6 8.825z"/></svg>
                    </div>
                    <div class="multi-select-dropdown">
                      <label class="multi-select-option multi-select-all" style="border-bottom:1px solid var(--border-light);margin-bottom:4px;padding-bottom:6px"><input type="checkbox" value="__all__" data-select-all> 全选</label>
                      <label class="multi-select-option"><input type="checkbox" value="Assistant Manager"> Assistant Manager</label>
                      <label class="multi-select-option"><input type="checkbox" value="Bartender"> Bartender</label>
                      <label class="multi-select-option"><input type="checkbox" value="Busser"> Busser</label>
                      <label class="multi-select-option"><input type="checkbox" value="Cashier"> Cashier</label>
                      <label class="multi-select-option"><input type="checkbox" value="Driver"> Driver</label>
                      <label class="multi-select-option"><input type="checkbox" value="Host"> Host</label>
                      <label class="multi-select-option"><input type="checkbox" value="Manager"> Manager</label>
                      <label class="multi-select-option"><input type="checkbox" value="Runner"> Runner</label>
                      <label class="multi-select-option"><input type="checkbox" value="Server"> Server</label>
                      <label class="multi-select-option"><input type="checkbox" value="Shift Lead"> Shift Lead</label>
                    </div>
                  </div>
                </div>
                <div class="filter-field">
                  <span class="filter-field-label">员工</span>
                  <div class="multi-select" id="employeeFilter" data-placeholder="All Staff">
                    <div class="multi-select-input" data-native-onclick="toggleIndexMultiSelect('employeeFilter')">
                      <div class="multi-select-tags"><span class="multi-select-placeholder">All Staff</span></div>
                      <svg class="multi-select-arrow" width="12" height="12" viewBox="0 0 12 12" fill="#999"><path d="M6 8.825a.5.5 0 0 1-.354-.146l-4-4a.5.5 0 0 1 .708-.708L6 7.617l3.646-3.646a.5.5 0 0 1 .708.708l-4 4A.5.5 0 0 1 6 8.825z"/></svg>
                    </div>
                    <div class="multi-select-dropdown" id="employeeFilterDropdown"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="tipout-table-wrap">
            <table class="data-table tipout-summary-table">
              <thead><tr><th>日期</th><th>状态</th><th>分配前</th><th>扣除</th><th>分得</th><th>分配后</th><th aria-label="进入明细"></th></tr></thead>
              <tbody id="dailySummaryList" aria-label="每日小费分配汇总"></tbody>
            </table>
          </div>
        </section>
      </div>
<div class="modal-overlay" id="emailModal">
        <div class="modal" style="width:480px">
          <div class="modal-header">
            <h3>发送到邮箱</h3>
            <button class="modal-close" data-native-onclick="closeModal('emailModal')">×</button>
          </div>
          <div class="modal-body">
            <div class="form-group">
              <label class="form-label">收件邮箱</label>
              <input type="email" id="exportEmail" class="form-control" placeholder="请输入邮箱地址，多个邮箱用逗号分隔" style="width:100%">
            </div>
            <div class="form-group">
              <label class="form-label">导出格式</label>
              <div style="display:flex;gap:16px">
                <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px">
                  <input type="radio" name="emailFormat" value="pdf" checked style="accent-color:var(--primary)"> PDF
                </label>
                <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px">
                  <input type="radio" name="emailFormat" value="csv" style="accent-color:var(--primary)"> CSV
                </label>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn" data-native-onclick="closeModal('emailModal')">取消</button>
            <button class="btn btn-primary" data-native-onclick="sendEmail()">发送</button>
          </div>
        </div>
      </div>
</section>
