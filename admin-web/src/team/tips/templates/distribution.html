<style data-team-tips-view-style>
.date-range-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; width: 100%; }
    @media (min-width: 769px) {
      /* 日期起止 + ~ 同一行，不换行 */
      .filter-bar--index .date-range-group {
        flex-wrap: nowrap;
      }
      .filter-bar--index .date-range-sep {
        flex-shrink: 0;
      }
      .filter-bar--index .filter-field--daterange {
        flex: 0 0 auto;
        min-width: 340px;
        max-width: 460px;
      }
      .filter-bar--index .date-range-group .form-control {
        flex: 0 0 auto;
        width: 158px;
        min-width: 140px;
        max-width: 200px;
      }
      .filter-bar--index .multi-select {
        min-width: 150px;
      }
    }
    .employee-section { margin-bottom: 24px; overflow-x: hidden; width: 100%; max-width: 100%; }
    .employee-section .employee-detail { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .employee-section .data-table { width: 100%; min-width: 520px; table-layout: fixed; }
    .employee-section .data-table td,
    .employee-section .data-table th { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tip-amount--deduct { color: var(--error, #cf1322); }
    .tip-amount--receive { color: var(--success, #389e0d); }
    .tip-balance-formula {
      font-size: 12px; color: var(--text-tertiary); margin: 0 0 12px; line-height: 1.5; text-align: center;
    }
    .employee-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 8px;
      padding-bottom: 8px; border-bottom: 1px solid var(--border-light);
    }
    .employee-name { font-size: 14px; font-weight: 600; }
    .fold-btn {
      border: none; background: none; cursor: pointer; color: var(--text-tertiary);
      font-size: 12px; display: flex; align-items: center; gap: 4px;
    }
    .fold-btn:hover { color: var(--primary); }
    .employee-detail { overflow: hidden; transition: max-height 0.3s; }
    .export-bar {
      position: fixed; bottom: 0; right: 0; left: 264px; z-index: 40;
      display: flex; justify-content: flex-end; padding: 12px 24px;
      background: #fff; border-top: 1px solid var(--border-light);
      box-shadow: 0 -2px 8px rgba(0,0,0,0.06);
    }
    @media (max-width: 768px) { .export-bar { left: 0; } }

    .export-dropdown { position: relative; }
    .export-menu {
      display: none; position: absolute; bottom: calc(100% + 8px); right: 0;
      background: #fff; border-radius: 8px; padding: 4px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08), 0 3px 6px -4px rgba(0,0,0,0.12), 0 9px 28px 8px rgba(0,0,0,0.05);
      min-width: 180px; z-index: 50;
    }
    .export-menu.show { display: block; }
    .export-menu-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px; cursor: pointer; border-radius: 6px;
      font-size: 14px; transition: background 0.2s; white-space: nowrap;
    }
    .export-menu-item:hover { background: rgba(0,0,0,0.04); }

    /* Multi-Select (index filter bar) */
    .filter-bar .multi-select { position: relative; }
    .filter-bar .multi-select-input {
      display: flex; align-items: center; min-height: 40px;
      padding: 4px 32px 4px 12px; border: 1px solid var(--border-color);
      border-radius: var(--radius-md); background: #fff; cursor: pointer;
      transition: border-color 0.2s; font-size: 14px;
    }
    .filter-bar .multi-select-input:hover { border-color: var(--primary); }
    .filter-bar .multi-select.open .multi-select-input {
      border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22,119,255,0.1);
    }
    .filter-bar .multi-select-arrow {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      transition: transform 0.2s; pointer-events: none; flex-shrink: 0;
    }
    .filter-bar .multi-select.open .multi-select-arrow { transform: translateY(-50%) rotate(180deg); }
    .filter-bar .multi-select-tags {
      display: flex; flex-wrap: wrap; gap: 4px; flex: 1; min-height: 24px;
      align-items: center;
    }
    .filter-bar .multi-select-tag {
      display: inline-flex; align-items: center; gap: 2px;
      padding: 1px 6px; background: #f5f5f5; border: 1px solid var(--border-light);
      border-radius: var(--radius-sm); font-size: 12px; line-height: 20px;
      white-space: nowrap; max-width: 120px; overflow: hidden; text-overflow: ellipsis;
    }
    .filter-bar .multi-select-tag i {
      font-style: normal; cursor: pointer; color: var(--text-tertiary);
      margin-left: 2px; font-size: 13px; line-height: 1;
    }
    .filter-bar .multi-select-tag i:hover { color: var(--text-primary); }
    .filter-bar .multi-select-dropdown {
      display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: #fff; border-radius: var(--radius-lg); padding: 4px;
      box-shadow: var(--shadow-md); z-index: 100; max-height: 220px; overflow-y: auto;
    }
    .filter-bar .multi-select.open .multi-select-dropdown { display: block; }
    .filter-bar .multi-select-option {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px; border-radius: var(--radius-sm); cursor: pointer;
      font-size: 13px; transition: background 0.15s;
    }
    .filter-bar .multi-select-option:hover { background: rgba(0,0,0,0.04); }
    .filter-bar .multi-select-option input[type="checkbox"] {
      width: 14px; height: 14px; accent-color: var(--primary); cursor: pointer;
    }
    .filter-bar .multi-select-placeholder {
      color: var(--text-tertiary); font-size: 13px; padding: 0 4px;
    }
</style>
<section class="team-tips-page tipout-fidelity tipout-page-summary" data-team-tips-view="distribution">
<div class="content-area">
        <section class="tipout-page-section" aria-labelledby="summaryTitle">
          <h1 id="summaryTitle" class="sr-only">小费分配</h1>
          <div class="tipout-store-scope-row">
            <div class="filter-field tipout-store-filter-field" id="storeFilterField">
              <label class="filter-field-label" for="storeSelect">门店</label>
              <select id="storeSelect" class="form-control form-control-lg" data-native-onchange="invalidateDayPipelineCache();renderDailySummaryList()">
                <option value="">请选择门店</option>
              </select>
            </div>
            <div class="tipout-heading-actions">
              <button id="summaryRuleEntryBtn" type="button" class="btn btn-lg" data-native-onclick="openSummaryRuleEntry()">新建/查看规则</button>
            </div>
          </div>

          <div class="tipout-view-filter-row">
            <!-- Filters：移动端默认折叠 -->
            <div class="filter-surface tipout-compact-toolbar tipout-view-filter-group">
            <div class="tipout-heading-tabs">
              <div class="tipout-view-switch" id="summaryViewSwitch" role="tablist" aria-label="汇总视图">
                <button type="button" id="dateTaskTab" role="tab" aria-selected="true" aria-controls="dateTaskPanel" tabindex="0" data-native-onclick="setSummaryView('date')" data-native-onkeydown="handleSummaryViewKeydown(event)">日期分配汇总</button>
                <button type="button" id="employeeReconciliationTab" role="tab" aria-selected="false" aria-controls="employeeReconciliationPanel" tabindex="-1" data-native-onclick="setSummaryView('employee')" data-native-onkeydown="handleSummaryViewKeydown(event)">员工分配汇总</button>
              </div>
            </div>
            <button type="button" class="filter-surface-toggle" data-native-onclick="toggleFilterSurface(this)" aria-expanded="false" aria-controls="indexFilterCollapsible">
              <span class="filter-surface-toggle-text">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
                筛选条件
              </span>
              <svg class="filter-surface-toggle-chevron" width="14" height="14" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M6 8.825a.5.5 0 0 1-.354-.146l-4-4a.5.5 0 0 1 .708-.708L6 7.617l3.646-3.646a.5.5 0 0 1 .708.708l-4 4A.5.5 0 0 1 6 8.825z"/></svg>
            </button>
            <div id="indexFilterCollapsible" class="filter-surface-collapsible">
              <div class="filter-bar filter-bar--page filter-bar--index">
                <div class="filter-field filter-field--daterange" id="dateRangeFilterField">
                  <span class="filter-field-label">日期范围</span>
                  <div class="date-range-group">
                    <input type="date" id="dateStart" class="form-control form-control-lg" data-native-onchange="renderDailySummaryList()">
                    <span class="date-range-sep" style="color:var(--text-tertiary)">~</span>
                    <input type="date" id="dateEnd" class="form-control form-control-lg" data-native-onchange="renderDailySummaryList()">
                  </div>
                </div>
                <div class="filter-field" id="dateAllocationStatusField">
                  <label class="filter-field-label" for="dateAllocationStatusFilter">分配状态</label>
                  <select id="dateAllocationStatusFilter" class="form-control form-control-lg" data-native-onchange="handleDateAllocationStatusChange(this.value)">
                    <option value="">全部状态</option>
                    <option value="allocated">已分配</option>
                    <option value="unallocated">未分配</option>
                  </select>
                </div>
                <div id="employeeSummaryFilters" class="tipout-employee-summary-filters" hidden>
                  <div class="filter-field">
                    <label class="filter-field-label" for="employeeSummaryRoleFilter">角色</label>
                    <select id="employeeSummaryRoleFilter" class="form-control form-control-lg" data-native-onchange="handleEmployeeSummaryRoleChange()">
                      <option value="">全部角色</option>
                    </select>
                  </div>
                  <div class="filter-field tipout-employee-multi-filter-field">
                    <span class="filter-field-label">员工</span>
                    <div class="multi-select" id="employeeSummaryEmployeeFilter" data-placeholder="全部员工">
                      <div class="multi-select-input" role="button" tabindex="0" data-native-onclick="toggleIndexMultiSelect('employeeSummaryEmployeeFilter')">
                        <div class="multi-select-tags"><span class="multi-select-placeholder">全部员工</span></div>
                        <svg class="multi-select-arrow" width="12" height="12" viewBox="0 0 12 12" fill="#999" aria-hidden="true"><path d="M6 8.825a.5.5 0 0 1-.354-.146l-4-4a.5.5 0 0 1 .708-.708L6 7.617l3.646-3.646a.5.5 0 0 1 .708.708l-4 4A.5.5 0 0 1 6 8.825z"/></svg>
                      </div>
                      <div class="multi-select-dropdown" id="employeeSummaryEmployeeOptions"></div>
                    </div>
                  </div>
                  <div class="filter-field">
                    <label class="filter-field-label" for="employeeSummaryStatusFilter">状态</label>
                    <select id="employeeSummaryStatusFilter" class="form-control form-control-lg" data-native-onchange="handleEmployeeSummaryFilterChange()">
                      <option value="">全部状态</option>
                      <option value="已完成">已完成</option>
                      <option value="待处理">待处理</option>
                      <option value="异常">异常</option>
                    </select>
                  </div>
                </div>
                <div class="filter-field tipout-date-sort-field" id="dateSortField">
                  <label class="filter-field-label" for="dateSortSelect">展示顺序</label>
                  <select id="dateSortSelect" class="form-control form-control-lg" aria-label="日期展示顺序" data-native-onchange="handleDateSortChange(this.value)">
                    <option value="desc">日期倒序</option>
                    <option value="asc">日期顺序</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
          </div>

          <div id="dateSummaryMetrics" class="tipout-metric-strip" aria-label="小费金额概览">
            <div><span id="summaryBeforeLabel">原始小费</span><strong id="summaryBefore">$0.00</strong></div>
            <div><span id="summaryDeductedLabel">入池金额</span><strong id="summaryDeducted">$0.00</strong></div>
            <div><span id="summaryReceivedLabel">已分配</span><strong id="summaryReceived">—</strong></div>
            <div class="is-primary"><span id="summaryAfterLabel">未分配</span><strong id="summaryAfter">—</strong></div>
            <div id="summaryPoolCountMetric"><span>小费池数量</span><strong id="summaryPoolCount">0</strong></div>
          </div>

          <div id="dateTaskPanel" role="tabpanel" aria-labelledby="dateTaskTab">
            <div class="tipout-table-wrap">
              <table class="data-table tipout-summary-table">
                <thead><tr><th id="dateSortHeader" aria-sort="descending"><button type="button" id="dateSortHeaderButton" class="tipout-date-sort-button" data-native-onclick="toggleSummaryDateSort()">日期 <span id="dateSortHeaderIcon" aria-hidden="true">↓</span></button></th><th>分配状态</th><th>原始小费</th><th>入池金额</th><th>已分配</th><th>未分配</th><th>小费池</th><th aria-label="进入明细">操作</th></tr></thead>
                <tbody id="dailySummaryList" aria-label="每日小费分配"></tbody>
              </table>
            </div>
          </div>
          <div id="employeeReconciliationPanel" role="tabpanel" aria-labelledby="employeeReconciliationTab" hidden>
            <div id="employeeSummaryMetrics" class="tipout-metric-strip tipout-employee-metrics" aria-label="员工分配结果概览">
              <div><span>员工人数</span><strong id="employeeMetricCount">0</strong></div>
              <div class="is-primary"><span>最终获得合计</span><strong id="employeeMetricFinal">—</strong><small>仅统计已确认且校验通过的分配结果</small></div>
              <div><span>已完成</span><strong id="employeeMetricCompleted">0</strong></div>
              <div><span>待处理</span><strong id="employeeMetricPending">0</strong><small id="employeeMetricExceptions" hidden></small></div>
            </div>
            <div class="tipout-table-wrap">
              <table class="data-table tipout-summary-table tipout-employee-table">
                <thead><tr>
                  <th aria-sort="none"><button id="employeeSortEmployee" type="button" class="tipout-table-sort" data-native-onclick="toggleEmployeeSummarySort('employee')">员工</button></th>
                  <th>角色</th>
                  <th>班次</th>
                  <th aria-sort="none"><button id="employeeSortHours" type="button" class="tipout-table-sort" data-native-onclick="toggleEmployeeSummarySort('hours')">工时</button></th>
                  <th>原有小费</th>
                  <th>净调整</th>
                  <th aria-sort="descending"><button id="employeeSortFinalAmount" type="button" class="tipout-table-sort" data-native-onclick="toggleEmployeeSummarySort('finalAmount')">最终获得 <span aria-hidden="true">↓</span></button></th>
                  <th>状态</th>
                  <th aria-label="进入明细"></th>
                </tr></thead>
                <tbody id="employeeReconciliationList" aria-label="员工小费分配汇总"></tbody>
              </table>
            </div>
            <div id="employeeReconciliationEmpty" class="tipout-empty-state" hidden>当前筛选范围暂无员工分配汇总数据</div>
          </div>
        </section>
      </div>
      <div id="summaryActionBar" class="tipout-summary-action-bar" aria-label="小费汇总操作">
        <div id="summaryDateActions" class="tipout-summary-date-actions">
          <button type="button" class="btn btn-lg" data-native-onclick="doCancelAllocate()">取消分配</button>
        </div>
        <div class="export-dropdown">
          <button type="button" class="btn btn-lg" data-native-onclick="toggleExportMenu()" aria-haspopup="menu">导出结果</button>
          <div class="export-menu" id="exportMenu" role="menu">
            <div class="export-menu-item" data-native-onclick="exportAs('pdf')">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0"><rect x="2" y="1" width="12" height="14" rx="2" stroke="#ff4d4f" stroke-width="1.2"/><text x="8" y="10.5" text-anchor="middle" fill="#ff4d4f" font-size="5" font-weight="600">PDF</text></svg>
              导出为 PDF
            </div>
            <div class="export-menu-item" data-native-onclick="exportAs('csv')">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0"><rect x="2" y="1" width="12" height="14" rx="2" stroke="#52c41a" stroke-width="1.2"/><text x="8" y="10.5" text-anchor="middle" fill="#52c41a" font-size="5" font-weight="600">CSV</text></svg>
              导出为 CSV
            </div>
            <div class="export-menu-item" data-native-onclick="openEmailModal()">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0"><rect x="1.5" y="3" width="13" height="10" rx="2" stroke="#1677ff" stroke-width="1.2"/><path d="M2 4l6 4 6-4" stroke="#1677ff" stroke-width="1.2" stroke-linecap="round"/></svg>
              发送到邮箱
            </div>
          </div>
        </div>
        <div id="summaryAllocateAction" class="tipout-summary-date-actions">
          <button id="allocateBtn" class="btn btn-primary btn-lg" data-native-onclick="openTipAllocationModal()">分配小费</button>
        </div>
      </div>
      <div class="modal-overlay" id="tipAllocationModal" aria-hidden="true" data-native-onclick="handleTipAllocationOverlayClick(event)">
        <div class="modal tipout-allocation-modal" role="dialog" aria-modal="true" aria-labelledby="tipAllocationModalTitle" aria-describedby="tipAllocationModalDescription">
          <div class="modal-header">
            <h3 id="tipAllocationModalTitle">分配小费</h3>
            <button type="button" id="closeTipAllocationModalBtn" class="modal-close" aria-label="关闭分配小费弹窗" data-native-onclick="closeTipAllocationModal()">×</button>
          </div>
          <div class="modal-body">
            <p id="tipAllocationModalDescription" class="tipout-allocation-modal__description">如果选择的日期已经分配过小费，新的分配结果会覆盖旧的结果。</p>
            <div class="form-group">
              <label class="form-label" for="allocationStore">门店</label>
              <select id="allocationStore" class="form-control"></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="allocationDateStart"><span class="tipout-required">*</span> 起始日期</label>
              <input id="allocationDateStart" type="date" class="form-control">
            </div>
            <div class="form-group">
              <label class="form-label" for="allocationDateEnd"><span class="tipout-required">*</span> 终止日期</label>
              <input id="allocationDateEnd" type="date" class="form-control">
            </div>
            <p id="allocationScopeError" class="tipout-allocation-modal__error" role="alert" hidden></p>
          </div>
          <div class="modal-footer">
            <button type="button" id="cancelTipAllocationBtn" class="btn" data-native-onclick="closeTipAllocationModal()">取消</button>
            <button type="button" id="confirmAllocateBtn" class="btn btn-primary" data-native-onclick="submitTipAllocationScope()">分配小费</button>
          </div>
        </div>
      </div>
<div class="modal-overlay" id="emailModal">
        <div class="modal" style="width:480px">
          <div class="modal-header">
            <h3>发送到邮箱</h3>
            <button class="modal-close" data-native-onclick="closeModal('emailModal')">×</button>
          </div>
          <div class="modal-body">
            <div class="form-group">
              <label class="form-label">收件邮箱</label>
              <input type="email" id="exportEmail" class="form-control" placeholder="请输入邮箱地址，多个邮箱用逗号分隔" style="width:100%">
            </div>
            <div class="form-group">
              <label class="form-label">导出格式</label>
              <div style="display:flex;gap:16px">
                <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px">
                  <input type="radio" name="emailFormat" value="pdf" checked style="accent-color:var(--primary)"> PDF
                </label>
                <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px">
                  <input type="radio" name="emailFormat" value="csv" style="accent-color:var(--primary)"> CSV
                </label>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn" data-native-onclick="closeModal('emailModal')">取消</button>
            <button class="btn btn-primary" data-native-onclick="sendEmail()">发送</button>
          </div>
        </div>
      </div>
</section>
