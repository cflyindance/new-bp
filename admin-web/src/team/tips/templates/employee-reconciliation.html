<section class="team-tips-page tipout-fidelity tipout-page-employee-reconciliation-detail" data-team-tips-view="employee-reconciliation">
  <main class="content-area">
    <section class="tipout-page-section" aria-labelledby="employeeDetailName">
      <div class="tipout-page-heading tipout-page-heading--with-back">
        <button type="button" class="btn" data-native-onclick="returnToEmployeeReconciliation()">← 返回员工对账</button>
        <div class="tipout-employee-detail-title">
          <h1 id="employeeDetailName">—</h1>
          <span id="employeeDetailRole" class="tipout-role-tag">未设置角色</span>
        </div>
        <div class="tipout-detail-export export-dropdown">
          <button id="employeeDetailExportButton" type="button" class="btn" aria-haspopup="menu" aria-expanded="false" data-native-onclick="toggleEmployeeDetailExportMenu(event)">导出结果⌄</button>
          <div id="employeeDetailExportMenu" class="export-menu" role="menu">
            <button type="button" class="export-menu-item" role="menuitem" data-native-onclick="runEmployeeDetailExport('pdf')">导出 PDF</button>
            <button type="button" class="export-menu-item" role="menuitem" data-native-onclick="runEmployeeDetailExport('csv')">导出 CSV</button>
            <button type="button" class="export-menu-item" role="menuitem" data-native-onclick="openEmployeeDetailEmailModal()">发送至邮箱</button>
          </div>
        </div>
      </div>
      <div id="employeeDetailContent">
        <div class="tipout-detail-date-range" aria-label="对账日期范围">
          <input id="employeeDetailStartDate" type="date" aria-label="开始日期">
          <span aria-hidden="true">～</span>
          <input id="employeeDetailEndDate" type="date" aria-label="结束日期">
          <label class="tipout-detail-attendance-filter">
            <span>考勤状态</span>
            <select id="employeeDetailAttendanceFilter" aria-label="考勤状态">
              <option value="全部状态">全部状态</option>
              <option value="已打卡">已打卡</option>
              <option value="未打卡">未打卡</option>
            </select>
          </label>
        </div>
        <div class="tipout-employee-detail-metrics" aria-label="员工对账金额概览">
          <div><span>班次</span><strong id="employeeDetailShifts">0</strong></div>
          <div><span>总工时</span><strong id="employeeDetailHours">0 h</strong></div>
          <div><span>分配前</span><strong id="employeeDetailBefore">$0.00</strong></div>
          <div><span>扣除</span><strong id="employeeDetailDeducted" class="tip-amount--deduct">-$0.00</strong></div>
          <div><span>分配获得</span><strong id="employeeDetailReceived" class="tip-amount--receive">+$0.00</strong></div>
          <div><span>实际获得</span><strong id="employeeDetailAfter">$0.00</strong></div>
        </div>
        <div id="employeeDetailTable" class="tipout-table-wrap">
          <table class="data-table tipout-summary-table tipout-employee-detail-table">
            <thead><tr><th>日期</th><th>考勤</th><th>班次 / 工时</th><th>分配前</th><th>扣除</th><th>分配获得</th><th>实际获得</th><th>分配状态</th></tr></thead>
            <tbody id="employeeDetailRows" aria-label="员工逐日对账明细"></tbody>
          </table>
        </div>
        <div id="employeeDetailFilteredEmpty" class="tipout-empty-state tipout-filtered-empty" hidden>
          <strong>当前筛选条件下暂无对账明细</strong>
        </div>
        <p class="tipout-readonly-note">明细页为只读核对视图，金额来自小费分配汇总的同一份逐日结果，不在此页面重新计算或修改。</p>
      </div>
      <div id="employeeDetailEmpty" class="tipout-empty-state" hidden>
        <strong>无法展示对账明细</strong><p>对账明细上下文已失效，请返回员工对账列表重新进入。</p>
      </div>
    </section>
  </main>
  <div class="modal-overlay" id="employeeDetailEmailModal">
    <div class="modal tipout-detail-email-modal">
      <div class="modal-header">
        <h3>发送到邮箱</h3>
        <button type="button" class="modal-close" aria-label="关闭" data-native-onclick="closeModal('employeeDetailEmailModal')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="employeeDetailExportEmail">收件邮箱</label>
          <input type="text" id="employeeDetailExportEmail" class="form-control" placeholder="请输入邮箱地址，多个邮箱用逗号分隔">
        </div>
        <div class="form-group">
          <span class="form-label">导出格式</span>
          <div id="employeeDetailEmailFormat" class="tipout-detail-email-formats">
            <label><input type="radio" name="employeeDetailEmailFormat" value="pdf" checked> PDF</label>
            <label><input type="radio" name="employeeDetailEmailFormat" value="csv"> CSV</label>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" data-native-onclick="closeModal('employeeDetailEmailModal')">取消</button>
        <button type="button" class="btn btn-primary" data-native-onclick="sendEmployeeDetailEmail()">发送</button>
      </div>
    </div>
  </div>
</section>
