<style data-team-tips-view-style>
.formula-section { margin-bottom: 24px; }
    .formula-display {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 16px 0; font-size: 14px;
    }
    .formula-block {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      min-width: 60px;
    }
    .formula-block .val { font-size: 16px; font-weight: 600; color: var(--text-primary); }
    .formula-block .lbl { font-size: 12px; color: var(--text-tertiary); white-space: nowrap; }
    .formula-block input.formula-input {
      width: 90px; height: 32px; padding: 4px 8px; border: 1px solid var(--border-color);
      border-radius: var(--radius-md); font-size: 14px; text-align: center; font-weight: 600;
    }
    .formula-block input.formula-input:focus {
      border-color: var(--primary); outline: none; box-shadow: 0 0 0 2px rgba(22,119,255,0.1);
    }
    .formula-block input.formula-pct { width: 56px; }
    .formula-operator { font-size: 18px; font-weight: 500; color: var(--text-secondary); padding: 0 4px; }
    .formula-display .formula-link { margin-left: auto; align-self: center; }
    .detail-card { margin-bottom: 16px; }
    .detail-table { width: 100%; border-collapse: collapse; }
    .detail-table th {
      background: rgba(0,0,0,0.02); padding: 10px 12px; text-align: left;
      border-bottom: 1px solid var(--border-light); font-weight: 500; font-size: 13px;
      white-space: nowrap;
    }
    .detail-table td {
      padding: 10px 12px; border-bottom: 1px solid var(--border-light); font-size: 13px;
      vertical-align: middle;
    }
    .detail-table .input-cell input {
      width: 60px; height: 28px; padding: 2px 8px; border: 1px solid var(--border-color);
      border-radius: var(--radius-sm); font-size: 13px; text-align: center;
    }
    .detail-table .input-cell input:focus {
      border-color: var(--primary); outline: none; box-shadow: 0 0 0 2px rgba(22,119,255,0.1);
    }
    .detail-table .action-cell { white-space: nowrap; }
    .detail-table .action-cell a {
      color: var(--primary); cursor: pointer; text-decoration: none; margin-right: 8px; font-size: 13px;
    }
    .detail-table .action-cell a.danger { color: var(--danger); }
    .role-label { display: inline-block; padding: 2px 8px; background: #f5f5f5; border-radius: 4px; font-size: 12px; }

    /* Formula detail modal */
    .rule-detail-item { margin-bottom: 12px; }
    .rule-detail-item .label { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
    .rule-detail-item .value { font-size: 14px; color: var(--text-primary); white-space: pre-line; }
    .detail-rule-bundle {
      margin-bottom: 24px;
      padding: 18px 20px 20px;
      background: #fff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .detail-rule-bundle .formula-rule-section {
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-light);
    }
    .detail-rule-bundle .detail-card {
      margin-bottom: 0;
      border: none;
      box-shadow: none;
    }
    .detail-rule-bundle .detail-card .card-body {
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-light);
    }
    .formula-rule-section { margin-bottom: 28px; padding-bottom: 12px; border-bottom: 1px solid var(--border-light); }
    .formula-rule-section:last-child { border-bottom: none; margin-bottom: 8px; }
    .detail-rule-block-title { margin: 0 0 6px; font-size: 15px; font-weight: 600; color: var(--text-primary); }
    .detail-rule-meta { font-size: 12px; color: var(--text-tertiary); margin: 0 0 10px; }
    /* 对齐小费分配页「分配结果」：角色摘要 + 可折叠员工表 */
    .detail-card-body-alloc .employee-section {
      margin-bottom: 20px;
      overflow-x: auto;
      width: 100%;
    }
    .detail-card-body-alloc .employee-section:last-child { margin-bottom: 0; }
    .detail-card-body-alloc .employee-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-light);
    }
    .detail-card-body-alloc .employee-name { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .detail-card-body-alloc .fold-btn {
      border: none;
      background: none;
      cursor: pointer;
      color: var(--text-tertiary);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: auto;
    }
    .detail-card-body-alloc .fold-btn:hover { color: var(--primary); }
    .detail-card-body-alloc .employee-detail {
      overflow: hidden;
      transition: max-height 0.3s ease;
      max-height: 2000px;
    }
    .detail-card-body-alloc .detail-role-summary-row .input-cell input {
      width: 64px;
      height: 28px;
      padding: 2px 8px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 13px;
      text-align: center;
    }
    .detail-card-body-alloc .data-table { width: 100%; table-layout: fixed; }
    .detail-card-body-alloc .data-table th,
    .detail-card-body-alloc .data-table td {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* 桌面端：仅日期+门店两项，勿横向拉伸产生过大空隙 */
    @media (min-width: 769px) {
      .filter-bar--detail {
        gap: 10px;
      }
      .filter-bar--detail .filter-field {
        flex: 0 0 auto;
        max-width: none;
        min-width: 0;
      }
      .filter-bar--detail .filter-field:first-child {
        width: 200px;
        max-width: 200px;
      }
      .filter-bar--detail .filter-field:nth-child(2) {
        width: 280px;
        max-width: 280px;
      }
    }
</style>
<section class="team-tips-page tipout-fidelity tipout-page-detail" data-team-tips-view="details">
<div class="content-area">
        <div class="tipout-page-heading tipout-page-heading--with-back">
          <button type="button" class="btn" data-native-onclick="returnToSummary()">返回汇总</button>
          <div>
            <h1>小费分配明细</h1>
          </div>
          <div class="tipout-heading-actions">
            <button type="button" class="btn" data-native-onclick="updateTipData()">更新小费数据</button>
          </div>
        </div>

        <div class="tipout-detail-context-bar">
          <div class="filter-field">
            <label for="detailDate">日期</label>
            <input type="date" id="detailDate" class="form-control" value="2026-01-03" data-native-onchange="renderDetailPage()">
          </div>
          <div class="filter-field">
            <label for="storeSelect">门店</label>
            <select id="storeSelect" class="form-control" data-native-onchange="renderDetailPage()">
              <option value="">请选择门店</option>
            </select>
          </div>
        </div>

        <div class="tipout-metric-strip tipout-detail-pool-metrics" aria-label="当日小费池金额汇总">
          <div><span>原始小费</span><strong id="detailOriginalTips">$0.00</strong></div>
          <div><span>入池金额</span><strong id="detailPoolAmount">—</strong></div>
          <div><span>已分配</span><strong id="detailAllocatedAmount">—</strong></div>
          <div class="is-primary"><span>未分配</span><strong id="detailUnallocatedAmount">—</strong></div>
          <div><span>小费池数量</span><strong id="detailPoolCount">0</strong></div>
        </div>

        <section class="tipout-detail-pool-section" aria-labelledby="detailPoolHeading">
          <div class="tipout-section-heading">
            <div><h2 id="detailPoolHeading">小费池执行结果</h2><p>各小费池独立展示执行状态与金额，规则详情和员工结果保留在下方。</p></div>
          </div>
          <div class="tipout-table-wrap">
            <table class="data-table tipout-pool-execution-table">
              <thead><tr><th>小费池</th><th>规则摘要</th><th>状态</th><th>入池金额</th><th>已分配</th><th>未分配</th></tr></thead>
              <tbody id="detailPoolExecutionList"></tbody>
            </table>
          </div>
        </section>

        <div class="tipout-workspace" id="detailWorkspace">
          <main id="detailMain"><div id="detailRulesContainer"></div></main>
        </div>

        <div class="tipout-sticky-actions" id="detailActionBar">
          <span>保存只沿用当前明细页已有逻辑</span>
          <div>
            <button class="btn" data-native-onclick="saveDetail()">保存</button>
            <button class="btn btn-primary" data-native-onclick="saveAndNext()">保存并跳转到下一天</button>
          </div>
        </div>
      </div>
<div class="modal-overlay" id="formulaModal">
    <div class="modal" style="width:600px">
      <div class="modal-header">
        <h3>公式详情 — 小费分配规则</h3>
        <button class="modal-close" data-native-onclick="closeModal('formulaModal')">×</button>
      </div>
      <div class="modal-body" id="formulaModalBody">
        <div style="padding:24px;color:var(--text-secondary);text-align:center">加载中…</div>
      </div>
      <div class="modal-footer">
        <button class="btn" data-native-onclick="closeModal('formulaModal')">关闭</button>
      </div>
    </div>
  </div>
</section>
