      body {

        background: #fff;

        overflow: hidden;
      }

      body::before {
        content: '';
        position: fixed;

        left: 1rem;
        width: 2rem;
        height: 2rem;
        background-color: #ffb702;
        border-radius: 50%;

        -webkit-user-select: none;

      /* 初始加载屏幕 - 纯CSS实现，不依赖JavaScript */
      #initial-loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #fff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        font-family: 'Inter', sans-serif;
      }

      #initial-loading-screen.hidden {
        display: none;
      }

      .loading-spinner {
        width: 60px;
        height: 60px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #ffb702;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }

      .loading-text {
        font-size: 18px;
        color: #333;
        margin-bottom: 10px;
      }

      .network-warning {
        margin-top: 20px;
        max-width: 300px;
        text-align: center;
      }

      .retry-button {
        background: #ffb702;
        color: white;
        border: none;
        padding: 1rem 2rem;
        border-radius: 2rem;
        font-size: 3rem;
      }

      button {
        -webkit-tap-highlight-color: transparent;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }

      .picker-item-selected {
        color: white !important;
      }

      .picker-item {
        font-size: 4.4rem;
      }

      .simple-keyboard {

        -ms-user-select: none;

        box-sizing: border-box;
        overflow: hidden;
        touch-action: manipulation;
      }

      }

      .simple-keyboard .hg-row .hg-button-container {
        display: -webkit-flex;
        display: flex;
      }

      .simple-keyboard .hg-button {
        display: inline-block;
        -webkit-flex-grow: 1;
        flex-grow: 1;
        cursor: pointer;
      }

      .simple-keyboard .hg-button span {

      }

      .simple-keyboard.hg-theme-default {
        background-color: rgba(0, 0, 0, 0.1);
        padding: 5px;
        border-radius: 5px;
      }

      .simple-keyboard.hg-theme-default .hg-button {

        height: 60px;
        border-radius: 5px;
        box-sizing: border-box;
        font-size: 24px;
        padding: 5px;
        background: #fff;
        border-bottom: 1px solid #b5b5b5;
        cursor: pointer;
        display: -webkit-flex;
        display: flex;
        -webkit-align-items: center;
        align-items: center;
        -webkit-justify-content: center;
        justify-content: center;
      }

      .simple-keyboard button.hg-button {

        font-size: inherit;

    <script type="text/javascript">
      // 5s后展示刷新按钮
      function showRefresh() {
        var warning = document.getElementById('network-warning');
        var loadingScreen = document.getElementById(
          'initial-loading-screen'
        );

        if (window.refreshTimer) {
          clearTimeout(window.refreshTimer);
        }
        window.refreshTimer = setTimeout(function () {
          if (
            !window.loadingState ||
            !loadingScreen.classList.contains('hidden')
          ) {
            if (warning) {
              warning.style.display = 'block';
            }
          }
          window.refreshTimer = null;
        }, 5000);
      }

      // 刷新
      function retryConnection() {
        window.location.reload();
      }

      // 隐藏初始加载屏幕
      function hideInitialLoading() {
        if (window.refreshTimer) {
          clearTimeout(window.refreshTimer);
          window.refreshTimer = null;
        }

        var loadingScreen = document.getElementById(
          'initial-loading-screen'
        );
        if (loadingScreen) {
          loadingScreen.classList.add('hidden');
          setTimeout(function () {
            loadingScreen.style.display = 'none';
          }, 100);
        }
      }

      // 暴露给全局的隐藏初始loading函数和js加载状态
      window.retryConnection = retryConnection;
      window.hideInitialLoading = hideInitialLoading;
      window.loadingState = false;
      window.refreshTimer = null;
      showRefresh();
    </script>
